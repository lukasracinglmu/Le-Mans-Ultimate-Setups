<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111318"><meta name="description" content="Rennkalender für Le Mans Ultimate.">
<title>Rennkalender | Three Peaks Racing</title>
<link rel="icon" type="image/webp" href="/assets/header-logo.webp?v=3p1">
<script src="/js/shared/theme.js"></script><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/shared/visual-polish.css"><link rel="stylesheet" href="/css/calendar.css">
</head>
<body>
<header>
<a class="brand" href="/" aria-label="Zur Startseite"><img class="brand-logo" src="/assets/bp-logo.webp?v=20261023-1" alt="Three Peaks Racing" width="96" height="48"><div class="brand-copy"><div class="brand-title">Three Peaks Racing</div><div class="brand-sub">LMU Setup Database</div></div></a>
<div class="header-actions">
<div id="account" class="account"><img id="accountAvatar" class="account-avatar" src="" alt=""><span id="accountName" class="account-name"></span><button data-action="logout">Logout</button></div>
<a id="loginButton" href="/auth/discord"><button class="discord-button">Discord Login</button></a>
<button data-action="toggle-theme" id="themeButton">Light Mode</button>
</div>
</header>
<main class="calendar-main">
<section class="hero"><div class="hero-kicker">Le Mans Ultimate</div><h1>Rennkalender</h1><p>Daily-, Championship- und Special-Events aus dem LMU Portal.</p></section>
<div class="calendar-tabs"><button class="calendar-tab active" data-tab="upcoming">Upcoming</button><button class="calendar-tab" data-tab="future">Future Schedule</button></div>
<section class="calendar-toolbar"><input id="search" class="search" placeholder="Rennen oder Strecke suchen…"><select id="safety"><option value="">Safety Ranking</option><option>Bronze</option><option>Silver</option><option>Gold</option></select><select id="class"><option value="">Klasse</option><option>GTE</option><option>GT3</option><option>LMP3</option><option>LMP2</option><option>HYPER-K</option></select><select id="type"><option value="">Renntyp</option><option value="daily">Daily</option><option value="championship">Championship</option><option value="special">Special Event</option></select></section>
<div id="status" class="status">Kalender wird geladen…</div><div id="calendar" class="calendar"></div>
</main><script type="module" src="/js/calendar.js"></script>
</body></html>
