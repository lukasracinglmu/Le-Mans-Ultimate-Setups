<!-- @file-notes: Setup Requests mit Fahrzeug- und Streckenvorschlägen sowie Formularübermittlung. -->
<!doctype html>
<html lang="de" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<title>Setup Request · Three Peaks Racing</title>
		<link rel="icon" href="/assets/header-logo.webp?v=3p1" type="image/webp" />
		<style>
			* {
				box-sizing: border-box;
			}
			:root {
				--bg: #111318;
				--surface: #191c22;
				--text: #f5f6f8;
				--muted: #a5a9b3;
				--border: #343943;
				--accent: #5865f2;
			}
			[data-theme='light'] {
				--bg: #f5f6f8;
				--surface: #fff;
				--text: #17191e;
				--muted: #59616d;
				--border: #d6dae1;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font:
					16px Arial,
					Helvetica,
					sans-serif;
			}
			header {
				height: 68px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 26px;
				border-bottom: 1px solid var(--border);
				background: var(--surface);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
				color: var(--text);
				text-decoration: none;
				font-weight: 800;
			}
			.brand img {
				width: 76px;
				height: 38px;
				object-fit: contain;
			}
			.back {
				color: var(--text);
				text-decoration: none;
				font-size: 13px;
			}
			main {
				max-width: 740px;
				margin: 38px auto;
				padding: 0 20px 70px;
			}
			h1 {
				margin: 0 0 8px;
				font-size: 30px;
			}
			p {
				color: var(--muted);
				line-height: 1.55;
			}
			form {
				margin-top: 24px;
				padding: 24px;
				border: 1px solid var(--border);
				border-radius: 12px;
				background: var(--surface);
			}
			.field {
				margin-bottom: 18px;
			}
			label {
				display: block;
				font-size: 13px;
				font-weight: 800;
				margin-bottom: 8px;
			}
			input,
			textarea,
			select {
				width: 100%;
				padding: 11px 12px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--bg);
				color: var(--text);
				font: inherit;
			}
			textarea {
				min-height: 110px;
				resize: vertical;
			}
			button {
				font: inherit;
				padding: 11px 15px;
				border: 0;
				border-radius: 8px;
				background: var(--accent);
				color: #fff;
				font-weight: 800;
				cursor: pointer;
			}
			.options {
				display: grid;
				gap: 5px;
				margin-top: 5px;
			}
			.option {
				padding: 9px 11px;
				border: 1px solid var(--border);
				border-radius: 7px;
				cursor: pointer;
			}
			.option:hover {
				border-color: var(--accent);
			}
			#trackOptions {
				max-height: 260px;
				overflow-y: auto;
			}
			.track-option {
				background: var(--bg);
				color: var(--text);
				font-weight: 400;
				text-align: left;
			}
			.track-option[aria-selected='true'] {
				border-color: var(--accent);
				outline: 1px solid var(--accent);
			}
			.hidden {
				display: none !important;
			}
			.result {
				margin-top: 12px;
				font-size: 13px;
			}
			@media (max-width: 520px) {
				header {
					padding: 0 14px;
				}
				.brand span {
					display: none;
				}
				.brand img {
					width: 58px;
				}
				form {
					padding: 18px;
				}
			}
		</style>
		<script src="/js/shared/theme.js"></script>
		<style id="visual-polish">
			button,
			a,
			.card,
			.user,
			.vehicle,
			.ticket,
			.setup-card,
			.manufacturer-card {
				transition:
					transform 0.18s ease,
					box-shadow 0.18s ease,
					border-color 0.18s ease,
					filter 0.18s ease;
			}
			button:hover,
			a:not(.brand):hover {
				transform: translateY(-2px);
			}
			.card:hover,
			.user:hover,
			.vehicle:hover,
			.ticket:hover,
			.setup-card:hover,
			.manufacturer-card:hover {
				transform: translateY(-3px);
				box-shadow: 0 12px 28px #0003;
				border-color: var(--accent, #5865f2);
			}
		</style>
	</head>
	<body>
		<header>
			<a class="brand" href="/"
				><img src="/assets/bp-logo.webp?v=20261023-1" alt="Three Peaks Racing" /><span
					>Three Peaks Racing</span
				></a
			><a class="back" href="/">Zur Datenbank</a>
		</header>
		<main>
			<h1>Setup Request</h1>
			<p>Fordere ein Setup für ein vorhandenes Fahrzeug an.</p>
			<form id="form">
				<div class="field">
					<label for="vehicle">Fahrzeug</label
					><input id="vehicle" autocomplete="off" placeholder="Fahrzeug suchen…" required />
					<div id="options" class="options hidden"></div>
				</div>
				<div class="field">
					<label for="carClass">Klasse</label><input id="carClass" readonly required />
				</div>
				<div class="field">
					<label for="track">Strecke</label
					><input
						id="track"
						maxlength="120"
						required
						placeholder="Strecke suchen…"
						autocomplete="off"
						role="combobox"
						aria-autocomplete="list"
						aria-controls="trackOptions"
						aria-expanded="false"
					/>
					<div
						id="trackOptions"
						class="options hidden"
						role="listbox"
						aria-label="Streckenvorschläge"
					></div>
				</div>
				<div class="field">
					<label for="manufacturer">Setup-Hersteller (optional)</label
					><select id="manufacturer">
						<option value="">Egal – keine Präferenz</option>
						<option value="GO">GO</option>
						<option value="HYMO">HYMO</option>
						<option value="beAlien">beAlien</option>
					</select>
				</div>
				<div class="field">
					<label for="message">Nachricht (optional)</label
					><textarea
						id="message"
						maxlength="1000"
						placeholder="Zusätzliche Informationen"
					></textarea>
				</div>
				<button type="submit">Request senden</button>
				<div id="result" class="result" role="status"></div>
			</form>
		</main>
		<script type="module" src="/js/request/main.js"></script>
	</body>
</html>
