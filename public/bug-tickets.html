<!-- @file-notes: Darstellung, Suche und Status-Tabs für die geschützte Ticketverwaltung. -->
<!doctype html>
<html lang="de" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Bug Tickets · Three Peaks Racing</title>
		<link rel="icon" href="/assets/header-logo.webp?v=3p1" />
		<style>
			* {
				box-sizing: border-box;
			}
			:root {
				--bg: #0e1014;
				--surface: #171a20;
				--surface2: #1e222a;
				--text: #f3f5f7;
				--muted: #949ba8;
				--border: #303640;
				--accent: #5b6ff5;
				--ok: #36b36b;
				--danger: #e34b4b;
				--progress: #d88725;
				--progress-bg: rgba(216, 135, 37, 0.14);
			}
			[data-theme='light'] {
				--bg: #f3f5f8;
				--surface: #fff;
				--surface2: #f7f8fa;
				--text: #15181d;
				--muted: #69717d;
				--border: #dfe3e8;
				--progress-bg: #fff2df;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 14px Arial;
			}
			button,
			input,
			select,
			textarea {
				font: inherit;
			}
			header {
				height: 68px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 26px;
				border-bottom: 1px solid var(--border);
				background: var(--surface);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 10px;
				font-weight: 800;
				color: var(--text);
				text-decoration: none;
				cursor: pointer;
			}
			.brand img {
				width: 48px;
			}
			.back {
				color: var(--text);
				text-decoration: none;
				padding: 9px 13px;
				border: 1px solid var(--border);
				border-radius: 8px;
			}
			main {
				max-width: 1380px;
				margin: auto;
				padding: 36px 28px 70px;
			}
			h1 {
				font-size: 30px;
				margin: 0 0 6px;
			}
			.muted {
				color: var(--muted);
			}
			.tabs {
				display: flex;
				gap: 5px;
				margin: 24px 0 12px;
			}
			.tabs button,
			.action {
				padding: 9px 14px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--surface);
				color: var(--text);
				cursor: pointer;
				font-weight: 700;
			}
			.tabs .active {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			.tabs #progressTab.active {
				background: var(--progress);
				border-color: var(--progress);
			}
			.searchbar {
				margin: 0 0 18px;
				position: relative;
				max-width: 460px;
			}
			.searchbar input {
				width: 100%;
				height: 42px;
				padding: 10px 42px 10px 13px;
				border: 1px solid var(--border);
				border-radius: 8px;
				background: var(--surface);
				color: var(--text);
				outline: none;
			}
			.searchbar input:focus {
				border-color: var(--accent);
			}
			.searchbar svg {
				position: absolute;
				right: 13px;
				top: 12px;
				width: 18px;
				height: 18px;
				fill: none;
				stroke: var(--muted);
				stroke-width: 2;
				stroke-linecap: round;
			}
			.shell {
				border: 1px solid var(--border);
				border-radius: 12px;
				overflow: hidden;
				background: var(--surface);
			}
			table {
				width: 100%;
				border-collapse: collapse;
				table-layout: fixed;
			}
			th {
				height: 42px;
				padding: 0 12px;
				text-align: left;
				background: var(--surface2);
				color: var(--muted);
				font-size: 12px;
			}
			td {
				height: 54px;
				padding: 8px 12px;
				border-top: 1px solid var(--border);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.row {
				cursor: pointer;
			}
			.row:hover {
				background: var(--surface2);
			}
			.row.in-progress {
				background: var(--progress-bg);
				box-shadow: inset 4px 0 0 var(--progress);
			}
			.row.in-progress:hover {
				background: rgba(216, 135, 37, 0.22);
			}
			.delete-row {
				border: 0;
				background: transparent;
				color: var(--muted);
				cursor: pointer;
				font-size: 16px;
				padding: 4px 6px;
				line-height: 1;
				border-radius: 6px;
			}
			.delete-row:hover {
				background: var(--danger);
				color: #fff;
			}
			.nr {
				color: #fff;
				font-weight: 800;
			}
			.row.in-progress .nr,
			.row.closed .nr {
				color: #fff;
			}
			.prio {
				font-weight: 800;
			}
			.Low {
				color: #58c981;
			}
			.Medium {
				color: #e8b84e;
			}
			.High {
				color: #ff6565;
			}
			.status-progress {
				color: #f0a43b;
				font-weight: 800;
			}
			.detail {
				border-top: 1px solid var(--border);
				background: var(--surface2);
				padding: 24px;
			}
			.grid {
				display: grid;
				grid-template-columns: 1fr 280px;
				gap: 22px;
			}
			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 18px;
			}
			.card.progress-card {
				border-color: var(--progress);
				box-shadow: inset 4px 0 0 var(--progress);
			}
			.card h2 {
				margin-top: 0;
			}
			.field {
				margin: 0 0 14px;
			}
			.field label {
				display: block;
				font-weight: 700;
				margin-bottom: 6px;
			}
			input,
			select,
			textarea {
				width: 100%;
				padding: 10px;
				border: 1px solid var(--border);
				border-radius: 7px;
				background: var(--bg);
				color: var(--text);
			}
			textarea {
				min-height: 120px;
				resize: vertical;
			}
			.description {
				white-space: pre-wrap;
				line-height: 1.6;
			}
			.detail img {
				max-width: 100%;
				max-height: 500px;
				border-radius: 8px;
				margin-top: 15px;
			}
			.actions {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				margin-top: 14px;
			}
			.save {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			.close {
				background: var(--ok);
				border-color: var(--ok);
				color: #fff;
			}
			.progress {
				background: var(--progress);
				border-color: var(--progress);
				color: #fff;
			}
			.reopen {
				background: #d88725;
				border-color: #d88725;
				color: #fff;
			}
			.empty {
				padding: 32px;
				text-align: center;
				color: var(--muted);
			}
			.info {
				padding: 9px 0;
				border-bottom: 1px solid var(--border);
			}
			.info span {
				display: block;
				color: var(--muted);
				font-size: 11px;
				margin-bottom: 3px;
			}
			@media (max-width: 800px) {
				.grid {
					grid-template-columns: 1fr;
				}
				main {
					padding: 25px 14px;
				}
				th:nth-child(4),
				td:nth-child(4) {
					display: none;
				}
				.searchbar {
					max-width: none;
				}
			}
		</style>
		<script src="/js/shared/theme.js"></script>
		<style id="visual-polish">
			button,
			a,
			.card,
			.user,
			.vehicle,
			.ticket,
			.setup-card,
			.manufacturer-card {
				transition:
					transform 0.18s ease,
					box-shadow 0.18s ease,
					border-color 0.18s ease,
					filter 0.18s ease;
			}
			button:hover,
			a:not(.brand):hover {
				transform: translateY(-2px);
			}
			.card:hover,
			.user:hover,
			.vehicle:hover,
			.ticket:hover,
			.setup-card:hover,
			.manufacturer-card:hover {
				transform: translateY(-3px);
				box-shadow: 0 12px 28px #0003;
				border-color: var(--accent, #5865f2);
			}
		</style>
	</head>
	<body>
		<header>
			<a class="brand" href="/" aria-label="Zur Startseite"
				><img src="/assets/bp-logo.webp?v=20261023-1" alt="Three Peaks Racing" /><span
					>Three Peaks Racing</span
				></a
			><a class="back" href="/">Zur Datenbank</a>
		</header>
		<main>
			<h1>Tickets</h1>
			<div class="muted">Bugmeldungen und Bearbeitungsstatus</div>
			<div class="tabs">
				<button id="openTab" class="active">Offen</button
				><button id="progressTab">In Bearbeitung</button><button id="closedTab">Geschlossen</button>
			</div>
			<div class="searchbar">
				<input
					id="ticketSearch"
					type="search"
					autocomplete="off"
					placeholder="Tickets durchsuchen…"
					aria-label="Tickets durchsuchen"
				/><svg viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="11" cy="11" r="7" />
					<path d="m20 20-4-4" />
				</svg>
			</div>
			<div class="shell">
				<div id="list"><div class="empty">Tickets werden geladen…</div></div>
				<div id="detail"></div>
			</div>
		</main>
		<script type="module" src="/js/bug-tickets/main.js"></script>
	</body>
</html>
