<!-- @file-notes: Darstellung, Suche und Status-Tabs für die geschützte Ticketverwaltung. -->
<!doctype html>
<html lang="de" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Bug Tickets · Three Peaks Racing</title>
		<link rel="icon" href="/assets/header-logo.webp?v=3p1" />
		<link rel="stylesheet" href="/css/bug-tickets.css" />
		<script src="/js/shared/theme.js"></script>
		<link rel="stylesheet" href="/css/shared/visual-polish.css" />
	</head>
	<body>
		<header>
			<a class="brand" href="/" aria-label="Zur Startseite"
				><img src="/assets/bp-logo.webp?v=20261023-1" alt="Three Peaks Racing" /><span
					>Three Peaks Racing</span
				></a
			><a class="back" href="/">Zur Datenbank</a>
		</header>
		<main>
			<h1>Tickets</h1>
			<div class="muted">Bugmeldungen und Bearbeitungsstatus</div>
			<div class="tabs">
				<button id="openTab" class="active">Offen</button
				><button id="progressTab">In Bearbeitung</button><button id="closedTab">Geschlossen</button>
			</div>
			<div class="searchbar">
				<input
					id="ticketSearch"
					type="search"
					autocomplete="off"
					placeholder="Tickets durchsuchen…"
					aria-label="Tickets durchsuchen"
				/><svg viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="11" cy="11" r="7" />
					<path d="m20 20-4-4" />
				</svg>
			</div>
			<div class="shell">
				<div id="list"><div class="empty">Tickets werden geladen…</div></div>
				<div id="detail"></div>
			</div>
		</main>
		<script type="module" src="/js/bug-tickets/main.js"></script>
	</body>
</html>
