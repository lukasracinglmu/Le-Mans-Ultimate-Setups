<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berechtigungstest · Three Peaks Racing</title><style>body{margin:0;background:#111318;color:#f5f6f8;font:16px Arial;padding:32px}.card{max-width:720px;margin:auto;background:#191c22;border:1px solid #343943;border-radius:14px;padding:24px}h1{margin-top:0}.item{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #343943}.ok{color:#44cf91}.no{color:#ff865f}.muted{color:#a5a9b3}</style></head><body><main class="card"><h1>Berechtigungstest</h1><p class="muted">Automatische Übersicht deiner aktuell erkannten Website-Rechte.</p><div id="result">Wird geprüft…</div></main><script>(()=>{const labels={databaseAccess:'Database ansehen',canUpload:'Setups hochladen, bearbeiten und löschen',canViewTickets:'Tickets sehen',canViewAdminPanel:'Admin-Panel sehen',fullAdmin:'Full Admin',isOwner:'Owner'};const result=document.getElementById('result');fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(d=>{if(!d.loggedIn){result.innerHTML='<p class="no">Nicht angemeldet.</p>';return}const u=d.user||{};result.innerHTML='<p><b>Discord:</b> '+String(u.username||'Unbekannt')+'</p>'+Object.entries(labels).map(([key,label])=>'<div class="item"><span>'+label+'</span><b class="'+(u[key]?'ok':'no')+'">'+(u[key]?'JA':'NEIN')+'</b></div>').join('')}).catch(()=>result.innerHTML='<p class="no">Berechtigungen konnten nicht geprüft werden.</p>')})();</script></body></html>
