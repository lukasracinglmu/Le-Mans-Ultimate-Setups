<!doctype html><html lang="de" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Bug melden · Three Peaks Racing</title><link rel="icon" href="/assets/header-logo.webp?v=3p1" type="image/webp"><style>*{box-sizing:border-box}:root{--bg:#111318;--surface:#191c22;--text:#f5f6f8;--muted:#a5a9b3;--border:#343943;--accent:#5865f2}[data-theme=light]{--bg:#f5f6f8;--surface:#fff;--text:#17191e;--muted:#59616d;--border:#d6dae1}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,Helvetica,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 26px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:bold;color:var(--text);text-decoration:none;cursor:pointer}.brand img{width:76px;height:38px;object-fit:contain}a{color:var(--text)}main{max-width:740px;margin:38px auto;padding:0 20px 60px}h1{font-size:30px;margin:0 0 12px}p{line-height:1.6;color:var(--muted)}form,.login-box{padding:24px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-top:24px}label{display:block;font-weight:bold;font-size:14px;margin:0 0 9px}.field{margin-bottom:20px}textarea,input[type=text],select{font:inherit;width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}textarea{resize:vertical;min-height:190px}textarea:focus,input:focus,select:focus{outline:2px solid var(--accent)}input[type=file]{font:inherit;max-width:100%;color:var(--text)}.hint{font-size:13px;margin:8px 0 20px}button{font:inherit;padding:11px 16px;border:0;border-radius:8px;cursor:pointer;background:var(--accent);color:#fff;font-weight:bold}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}#preview{display:block;max-width:100%;max-height:300px;margin:14px 0;border:1px solid var(--border);border-radius:8px}#result{margin:16px 0 0;line-height:1.5;font-size:14px}#result[data-state=error]{color:#ff865f}#result[data-state=success]{color:#44cf91}@media(max-width:520px){header{padding:12px 16px}.brand{font-size:13px}.brand img{width:54px}main{margin-top:26px}form{padding:18px}}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tpr-theme')==='light'?'light':'dark'}catch{}</script></head><body><header><a class="brand" href="/" aria-label="Zur Startseite"><img src="/assets/header-logo.webp" alt="Three Peaks Racing"><span>Three Peaks Racing</span></a><a href="/">Zur Datenbank</a></header><main><h1>Bug melden</h1><p>Beschreibe das Problem möglichst genau. Titel, Beschreibung und Priorität werden direkt als Ticket gespeichert.</p><div id="loginState" class="login-box" role="status">Anmeldung wird geprüft…</div><form id="bugReportForm" class="hidden"><div class="field"><label for="title">Titel</label><input id="title" name="title" type="text" minlength="3" maxlength="120" required placeholder="Kurzer Titel des Problems"></div><div class="field"><label for="description">Problem beschreiben</label><textarea id="description" name="description" minlength="3" maxlength="3500" required placeholder="Was hast du gemacht? Was ist dann passiert?"></textarea></div><div class="field"><label for="priority">Priorität</label><select id="priority" name="priority" required><option value="Low">Low</option><option value="Medium" selected>Medium</option><option value="High">High</option></select></div><div class="field"><label for="image">Bild hinzufügen (optional)</label><input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">PNG, JPG oder WebP, maximal 5 MiB.</p><img id="preview" class="hidden" alt="Vorschau des angehängten Bildes"></div><button id="sendReport" type="submit">Bugmeldung senden</button><p id="result" role="status" aria-live="polite"></p></form></main><script>(()=>{const form=document.getElementById('bugReportForm'),login=document.getElementById('loginState'),button=document.getElementById('sendReport'),result=document.getElementById('result'),image=document.getElementById('image'),preview=document.getElementById('preview');let busy=false,previewUrl=null,reportId=crypto.randomUUID().replace(/-/g,'').slice(0,25);form.addEventListener('input',()=>{if(!busy)reportId=crypto.randomUUID().replace(/-/g,'').slice(0,25);});const revoke=()=>{if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;};image.addEventListener('change',()=>{revoke();preview.classList.add('hidden');const file=image.files[0];if(!file)return;if(file.size>5*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){result.textContent='Bitte PNG, JPG oder WebP mit maximal 5 MiB auswählen.';result.dataset.state='error';image.value='';return;}previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.classList.remove('hidden');});form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const title=document.getElementById('title').value.trim(),description=document.getElementById('description').value.trim(),priority=document.getElementById('priority').value;if(title.length<3||description.length<3)return;busy=true;button.disabled=true;button.textContent='Wird gesendet…';result.textContent='';try{const data=new FormData();data.set('title',title);data.set('description',description);data.set('priority',priority);data.set('reportId',reportId);if(image.files[0])data.set('image',image.files[0]);const response=await fetch('/api/bug-reports',{method:'POST',credentials:'same-origin',body:data,signal:AbortSignal.timeout(60000)}),body=await response.json();if(!response.ok||!body.success)throw Error(body.error||'Meldung konnte nicht gesendet werden.');result.textContent='Bugmeldung wurde als Ticket '+body.ticket+' erstellt.';result.dataset.state='success';form.reset();document.getElementById('priority').value='Medium';revoke();preview.classList.add('hidden');reportId=crypto.randomUUID().replace(/-/g,'').slice(0,25);}catch(error){result.textContent=error.message||'Verbindung unterbrochen.';result.dataset.state='error';}finally{busy=false;button.disabled=false;button.textContent='Bugmeldung senden';}});window.addEventListener('pagehide',revoke);fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(data=>{if(!data.loggedIn){login.innerHTML='<p>Bitte melde dich mit Discord an, um eine Bugmeldung zu senden.</p><a href="/auth/discord">Mit Discord anmelden</a>';return;}login.classList.add('hidden');form.classList.remove('hidden');}).catch(()=>login.textContent='Die Anmeldung konnte nicht geprüft werden.');})();</script></body></html>
