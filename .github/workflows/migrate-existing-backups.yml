name: Organize Backup Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only backup tags and create organized folders
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPOSITORY: lukasracinglmu/LMU-Database-Backups
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_TOKEN:-}" ]; then
            echo "BACKUP_REPO_TOKEN is not configured."
            exit 1
          fi

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          git clone "https://x-access-token:$BACKUP_TOKEN@github.com/$BACKUP_REPOSITORY.git" "$WORK/backup"
          cd "$WORK/backup"
          git fetch --tags --force

          mapfile -t TAGS < <(git tag -l 'backup-*' | sort)
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No backup tags found."
            exit 1
          fi

          git config user.name "LMU Backup Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan organized-main
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p backups

          for TAG in "${TAGS[@]}"; do
            DATE="${TAG#backup-}"
            DATE="${DATE:0:10}"
            mkdir -p "backups/$DATE"
            cat > "backups/$DATE/$TAG.md" <<EOF
          # LMU Backup

          **Backup name:** `$TAG`
          **Date:** `$DATE`

          [Download this backup as ZIP](https://github.com/$BACKUP_REPOSITORY/archive/refs/tags/$TAG.zip)
          EOF
          done

          cat > README.md <<EOF
          # LMU Database Backups

          This private repository contains only automatic backups and backups created manually through the LMU portal.

          Backups are organized below `backups/YYYY-MM-DD/`. Each entry links to the complete repository state stored under its backup tag.
          EOF

          git add README.md backups
          git commit -m "Organize LMU backups by date"
          git branch -M main
          git push --force origin main

          while read -r _ REF; do
            BRANCH="${REF#refs/heads/}"
            if [ "$BRANCH" != "main" ]; then
              git push origin --delete "$BRANCH" || true
            fi
          done < <(git ls-remote --heads origin)

          echo "Backup repository organized successfully."
