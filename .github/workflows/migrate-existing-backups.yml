name: Migrate Existing Backups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy existing backup tags to private backup repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPOSITORY: lukasracinglmu/LMU-Database-Backups
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_TOKEN:-}" ]; then
            echo "BACKUP_REPO_TOKEN is not configured."
            exit 1
          fi

          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          git clone --mirror "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$WORK/source.git"

          git -C "$WORK/source.git" push "https://x-access-token:$BACKUP_TOKEN@github.com/$BACKUP_REPOSITORY.git" --all
          git -C "$WORK/source.git" push "https://x-access-token:$BACKUP_TOKEN@github.com/$BACKUP_REPOSITORY.git" --tags

          git ls-remote --tags "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" |
            awk '{print $2}' | sed 's#refs/tags/##' |
            grep -E '^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}$' |
            while read -r OLD_TAG; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$OLD_TAG"
              echo "Removed old backup tag $OLD_TAG from the main repository."
            done

          echo "Existing repository history and backup tags were migrated."
          echo "The backup tags now live in $BACKUP_REPOSITORY."
