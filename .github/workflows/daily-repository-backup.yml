name: Daily Repository Backup

on:
  schedule:
    # Hourly is required because GitHub cron uses UTC and Berlin switches between CET and CEST.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Create daily backup at midnight Europe/Berlin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export TZ=Europe/Berlin
          if [ "$(date +%H:%M)" != "00:00" ]; then
            echo "Not midnight in Europe/Berlin. Nothing to do."
            exit 0
          fi

          TODAY="$(date +%Y-%m-%d)"
          TAG="backup-$TODAY"

          if git ls-remote --exit-code --tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Backup $TAG already exists."
          else
            git init backup-source
            cd backup-source
            git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
            git fetch --depth=1 origin main
            git checkout --detach FETCH_HEAD
            git tag -a "$TAG" -m "Daily full repository backup $TODAY"
            git push origin "$TAG"
            cd ..
            rm -rf backup-source
            echo "Created $TAG."
          fi

          CUTOFF="$(date -d '5 days ago' +%Y-%m-%d)"
          git ls-remote --tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"             | awk '{print $2}'             | sed 's#refs/tags/##'             | grep '^backup-[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$'             | while read -r OLD_TAG; do
                OLD_DATE="${OLD_TAG#backup-}"
                if [[ "$OLD_DATE" < "$CUTOFF" ]]; then
                  git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" ":refs/tags/$OLD_TAG"
                  echo "Deleted $OLD_TAG."
                fi
              done
