name: Complete Repository Backup

on:
  repository_dispatch:
    types: [lmu-repository-backup]
  workflow_dispatch:
    inputs:
      request:
        description: "JSON backup job supplied by the owner portal"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: lmu-repository-backups
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy and verify all repository files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REQUEST: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.request }}
        run: python3 scripts/repository-backup.py
