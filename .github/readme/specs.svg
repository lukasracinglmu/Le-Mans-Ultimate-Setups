<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">Klassen und Upload-Grenzen</title><desc id="desc">4 Fahrzeugklassen, bis zu 50 ZIPs pro Auswahl, 25 MiB pro Datei und 40 Zeichen pro Version.</desc><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4dfa0"/><stop offset=".45" stop-color="#caa24e"/><stop offset="1" stop-color="#f4dda0"/></linearGradient><radialGradient id="glow"><stop stop-color="#b88c37" stop-opacity=".12"/><stop offset="1" stop-color="#b88c37" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 H 0 V 40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="128" rx="10" fill="#171c20"/><path d="M 300 28 V 100 M 600 28 V 100 M 900 28 V 100" stroke="#343d42"/><g text-anchor="middle"><g font-size="35" font-weight="700" fill="#e6ca83"><text x="150" y="59">4 Klassen</text><text x="450" y="59">50 ZIPs</text><text x="750" y="59">25 MiB</text><text x="1050" y="59">40 Zeichen</text></g><g font-size="16" fill="#c0c7cb"><text x="150" y="92">im Fahrzeugkatalog</text><text x="450" y="92">maximal pro Auswahl</text><text x="750" y="92">maximal pro Datei</text><text x="1050" y="92">maximal pro Version</text></g></g></svg>
