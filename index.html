<style>

.layout{display:flex;min-height:calc(100vh - 68px);align-items:flex-start}main{flex:1;max-width:1140px;margin:0 auto;padding:48px 26px 80px;min-width:0}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:16px;padding:34px 34px 32px;margin-bottom:26px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;right:-30px;top:50%;width:310px;height:160px;transform:translateY(-50%);background:url('/assets/three-peaks-racing-logo.webp') center/contain no-repeat;opacity:.055;pointer-events:none}.hero-kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.hero h1{position:relative;z-index:1;margin:0 0 9px;font-size:40px;line-height:1.04;letter-spacing:-1.2px;max-width:760px}.hero p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:16px;max-width:700px;line-height:1.5}.manufacturer-strip{margin-top:18px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.manufacturer-name{font-weight:700;color:var(--text);min-width:62px;transition:opacity .2s ease}.search{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);outline:none;margin-bottom:34px}.search:focus{border-color:var(--accent)}.category{margin-bottom:40px}.category h2{font-size:20px;margin:0 0 14px}.vehicle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.vehicle{position:relative;overflow:hidden;min-height:104px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:18px;cursor:pointer;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease}.vehicle:after{content:"";position:absolute;right:-14px;bottom:-18px;width:125px;height:70px;background:url('/assets/three-peaks-racing-logo.webp') center/contain no-repeat;opacity:.045;pointer-events:none}.vehicle:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}.vehicle-name{position:relative;z-index:1;font-weight:700}.vehicle-class{position:relative;z-index:1;margin-top:7px;color:var(--muted);font-size:12px}.page{display:none}.page.active{display:block}.back{margin-bottom:24px}.car-title{margin:0 0 7px;font-size:34px}.car-subtitle{color:var(--muted);margin-bottom:22px}.upload-area{display:flex;align-items:flex-start;gap:12px;margin-bottom:24px;flex-wrap:wrap}.upload-btn{background:var(--text);color:var(--bg);border:0;font-weight:700}.upload-btn:disabled{opacity:.55;cursor:wait}.retry-upload-btn{display:none;background:var(--surface2);font-weight:700;border:1px solid var(--border)}.retry-upload-btn.show{display:inline-flex;background:#b91c1c;border-color:#b91c1c;color:#fff;animation:retryPulse 1.8s ease-in-out infinite}.retry-upload-btn.show:hover{background:#991b1b;border-color:#991b1b;animation:none}.retry-upload-btn:disabled{opacity:.55;cursor:wait;animation:none}@keyframes retryPulse{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.55)}50%{box-shadow:0 0 0 7px rgba(185,28,28,0)}}@media(prefers-reduced-motion:reduce){.retry-upload-btn.show{animation:none;outline:2px solid #b91c1c}}.upload-status{font-size:13px;color:var(--muted);padding-top:8px}.file-statuses{width:100%;display:grid;gap:5px;margin-top:6px}.file-status{font-size:12px;color:var(--muted)}.file-status.ok{color:#16803c}.file-status.err{color:#c83232}.setup-group{margin:26px 0}.setup-group-title{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 0 10px}.setup{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:15px 16px;margin-bottom:9px}.setup-info{min-width:0}.setup-track{font-weight:700;word-break:break-word}.setup-meta{margin-top:5px;color:var(--muted);font-size:12px}.setup-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}.download{white-space:nowrap;text-decoration:none;background:var(--text);color:var(--bg);padding:9px 13px;border-radius:7px;font-size:13px}.delete-btn{display:none;width:38px;height:38px;align-items:center;justify-content:center;padding:0;border:1px solid color-mix(in srgb,var(--danger) 35%,var(--border));background:color-mix(in srgb,var(--dangerbg) 70%,var(--surface));color:var(--danger);font-size:18px;border-radius:8px;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}.delete-btn:hover{background:var(--danger);border-color:var(--danger);color:#fff;transform:translateY(-1px)}.empty{color:var(--muted);padding:24px 0}.request-section{margin-top:52px;padding-top:32px;border-top:1px solid var(--border)}.request-section h2{margin:0 0 6px}.request-form{max-width:680px}.request-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.request-form label{display:block;margin:16px 0 7px;font-size:13px;font-weight:700}.request-form input,.request-form textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 12px;background:var(--surface);color:var(--text);outline:none}.request-form textarea{min-height:104px;resize:vertical}.request-message{margin-top:10px;font-size:13px}.login-required{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:22px;color:var(--muted)}.admin-panel{margin-top:32px;padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.admin-panel h3{margin:0 0 12px}.admin-row{display:flex;gap:8px;flex-wrap:wrap}.admin-row input{flex:1;min-width:220px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;padding:10px}.upcoming{margin:0 0 28px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:18px;display:none}.upcoming.show{display:block}.upcoming h2{font-size:18px;margin:0 0 12px}.race-list{display:grid;gap:8px}.race{padding:12px;border:1px solid var(--border);border-radius:8px}.race-name{font-weight:700}.race-meta{color:var(--muted);font-size:12px;margin-top:5px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-backdrop.show{display:flex}.modal{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.modal h3{margin:0 0 8px}.modal p{margin:0;color:var(--muted);line-height:1.45;word-break:break-word}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.danger-action{background:var(--danger);border-color:var(--danger);color:#fff}.danger-action:hover{filter:brightness(.95);background:var(--danger)}
@media(max-width:650px){header{padding:0 13px}.brand-title{font-size:13px}.brand-sub,.account-name{display:none}.brand-logo{width:40px}.header-actions{gap:6px}.header-actions button{padding:8px 9px;font-size:12px}main{padding:28px 14px 60px}.hero{padding:26px 20px}.hero h1{font-size:31px}.hero:after{width:190px;right:-45px}.request-grid{grid-template-columns:1fr}.setup{align-items:flex-start;flex-direction:column}.setup-actions{width:100%}.download{flex:1;text-align:center}.delete-btn{display:flex!important}.vehicle-grid{grid-template-columns:1fr 1fr}.vehicle{min-height:112px;padding:14px}}@media(max-width:430px){.vehicle-grid{grid-template-columns:1fr}.hero h1{font-size:28px}}
.mfr-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.mfr-btn{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}.mfr-btn:hover{border-color:var(--accent);color:var(--accent)}.mfr-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}.track-search{margin-bottom:18px}.vendor-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}.vendor-tag.GO{background:#4a1616;color:#ff5a5f}.vendor-tag.HYMO{background:#3a0f4f;color:#e879ff}.vendor-tag.beAlien{background:#123b24;color:#4ade80}
</style>

<body>
<header>
  <div class="brand">
    <img class="brand-logo" src="/assets/three-peaks-racing-logo.webp" alt="Three Peaks Racing" width="48" height="28">
    <div class="brand-copy"><div class="brand-title">Three Peaks Racing</div><div class="brand-sub">LMU Setup Database</div></div>
  </div>
  <div class="header-actions">
    <div id="account" class="account"><img id="accountAvatar" class="account-avatar" src="" alt=""><span id="accountName" class="account-name"></span><button onclick="logout()">Logout</button></div>
    <a id="loginButton" href="/auth/discord" style="text-decoration:none"><button class="discord-button">Discord Login</button></a>
    <button onclick="toggleTheme()" id="themeButton">Light Mode</button>
  </div>
</header>
<div class="layout">
<main>
<section id="homePage" class="page active">
  <div class="hero"><div class="hero-kicker">Le Mans Ultimate</div><h1>Three Peaks Racing Setup Database</h1><p>Setups für Le Mans Ultimate – übersichtlich nach Fahrzeug, Variante und Rennserie.</p><div class="manufacturer-strip"><span>Setup Hersteller:</span><span id="manufacturerName" class="manufacturer-name">GO</span></div></div>
  <div id="mfrFilter" class="mfr-filter"><button class="mfr-btn active" data-mfr="">Alle</button><button class="mfr-btn" data-mfr="GO">GO</button><button class="mfr-btn" data-mfr="HYMO">HYMO</button><button class="mfr-btn" data-mfr="beAlien">beAlien</button></div>
  <div id="classFilter" class="mfr-filter"><button class="mfr-btn active" data-class="">Alle</button><button class="mfr-btn" data-class="Hypercar">Hypercar</button><button class="mfr-btn" data-class="LMP2">LMP2</button><button class="mfr-btn" data-class="LMP3">LMP3</button><button class="mfr-btn" data-class="LMGT3">LMGT3</button></div>
<input id="search" class="search" placeholder="Fahrzeug suchen...">
  <div id="categories"></div>
  <div class="request-section">
    <h2>Setup Request</h2>
    <div id="requestLoginRequired" class="login-required">Melde dich mit Discord an, um einen Setup Request zu senden.</div>
    <form id="requestForm" class="request-form hidden">
      <div class="request-grid"><div><label for="reqVehicle">Fahrzeug</label><input id="reqVehicle" required></div><div><label for="reqClass">Klasse</label><input id="reqClass" placeholder="z. B. Hypercar"></div><div><label for="reqTrack">Strecke</label><input id="reqTrack" required></div><div><label for="reqEvent">Event / Rennserie</label><input id="reqEvent" placeholder="z. B. WEC"></div><div><label for="reqVariant">Setup Variante</label><input id="reqVariant" placeholder="z. B. EVO / Wet"></div></div>
      <label for="reqMsg">Weitere Informationen</label><textarea id="reqMsg"></textarea>
      <button type="submit" class="discord-button">Request senden</button><div id="requestResult" class="request-message"></div>
    </form>
    <div id="adminPanel" class="admin-panel hidden"><h3>Admin</h3><div class="admin-row"><input id="adminUserId" placeholder="Discord User ID"><button onclick="grantUploadAccess()">Upload freigeben</button><button onclick="revokeUploadAccess()">Freigabe entfernen</button><button onclick="registerRequestCommand()">/request registrieren</button></div><div id="adminResult" class="request-message"></div></div>
  </div>
</section>
<section id="carPage" class="page"><button class="back" onclick="showHome()">← Zurück</button><h1 id="carTitle" class="car-title"></h1><div id="carSubtitle" class="car-subtitle"></div><div id="uploadArea" class="upload-area" style="display:none"><input id="fileInput" type="file" accept=".zip,application/zip" multiple hidden><button class="upload-btn" id="uploadBtn">⬆ Setups hochladen</button><button type="button" class="retry-upload-btn" id="retryFailedBtn">Fehlgeschlagene erneut hochladen</button><span id="uploadStatus" class="upload-status"></span><div id="fileStatuses" class="file-statuses"></div></div><input id="trackSearch" class="search track-search" placeholder="Strecke suchen…" style="display:none"><div id="setupList"></div></section>
</main>
</div>
<div id="deleteModal" class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><h3>Setup löschen?</h3><p id="deleteModalText"></p><div class="modal-actions"><button id="deleteCancel">Abbrechen</button><button id="deleteConfirm" class="danger-action">Löschen</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let setupData={},currentUser=null,currentCar={category:"",vehicle:""},pendingDelete=null,lastUploadJobs=[],activeMfr='',activeClass='',savedScrollY=0,trackSearchVal='',uploadQueueRunning=false;const setupCache=new Map(),setupPending=new Map();const SETUP_CACHE_MS=30000;
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function loadTheme(){const saved=localStorage.getItem("tpr-theme");const t=saved==="light"?"light":"dark";document.documentElement.dataset.theme=t;$("themeButton").textContent=t==="dark"?"Light Mode":"Dark Mode"}function toggleTheme(){const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("tpr-theme",t);$("themeButton").textContent=t==="dark"?"Light Mode":"Dark Mode"}
function initManufacturer(){const names=["GO","HYMO","beAlien"];let i=0;setInterval(()=>{const el=$("manufacturerName");el.style.opacity="0";setTimeout(()=>{i=(i+1)%names.length;el.textContent=names[i];el.style.opacity="1"},180)},3500)}
async function checkLogin(){try{const r=await fetch("/api/me",{cache:"no-store",credentials:"same-origin"});const d=await r.json();if(d.loggedIn){currentUser=d.user;$("loginButton").classList.add("hidden");$("account").style.display="flex";$("accountName").textContent=d.user.username;if(d.user.avatar){$("accountAvatar").src=d.user.avatar;$("accountAvatar").style.display="block"}$("requestLoginRequired").classList.add("hidden");$("requestForm").classList.remove("hidden");if(d.user.isOwner)$("adminPanel").classList.remove("hidden")}else{currentUser=null;$("loginButton").classList.remove("hidden");$("account").style.display="none";$("requestLoginRequired").classList.remove("hidden");$("requestForm").classList.add("hidden")}}catch(e){console.error(e)}}function logout(){location.href="/auth/logout"}
async function loadData(){try{const r=await fetch("/setups.json",{cache:"force-cache"});if(!r.ok)throw new Error();setupData=await r.json();renderCategories()}catch{$("categories").innerHTML='<div class="empty">Fahrzeuge konnten nicht geladen werden.</div>'}}
function renderCategories(filter=""){const box=$("categories");box.innerHTML="";const q=filter.trim().toLowerCase();Object.entries(setupData).forEach(([cat,vehicles])=>{if(activeClass&&cat!==activeClass)return;const list=vehicles.filter(v=>v.name.toLowerCase().includes(q));if(!list.length)return;const sec=document.createElement("section");sec.className="category";const h=document.createElement("h2");h.textContent=cat;sec.appendChild(h);const grid=document.createElement("div");grid.className="vehicle-grid";list.forEach(v=>{const card=document.createElement("div");card.className="vehicle";const n=document.createElement("div");n.className="vehicle-name";n.textContent=v.name;const c=document.createElement("div");c.className="vehicle-class";c.textContent=cat;card.append(n,c);card.addEventListener("click",()=>showCar(cat,v.name));grid.appendChild(card)});sec.appendChild(grid);box.appendChild(sec)});if(!box.children.length)box.innerHTML='<div class="empty">Kein Fahrzeug gefunden.</div>'}
function showHome(){activeMfr='';document.querySelectorAll('#mfrFilter .mfr-btn').forEach(b=>b.classList.toggle('active',(b.dataset.mfr||'')===''));$("carPage").classList.remove("active");$("homePage").classList.add("active");const sy=savedScrollY;requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,sy)))}async function showCar(category,vehicle){savedScrollY=window.scrollY;currentCar={category,vehicle};lastUploadJobs=[];trackSearchVal='';$("retryFailedBtn").classList.remove("show");$("homePage").classList.remove("active");$("carPage").classList.add("active");$("carTitle").textContent=vehicle;$("carSubtitle").textContent=category;$("uploadStatus").textContent="";$("fileStatuses").innerHTML="";$("uploadArea").style.display=currentUser?.canUpload?"flex":"none";const ts=$("trackSearch");if(ts){ts.value='';ts.style.display='block';}await loadCarSetups(category,vehicle)}
function classifyVendor(name){const n=String(name||'').toUpperCase();if(n.includes('HYMO'))return'HYMO';if(n.includes('BEALIEN')||n.includes('BE_ALIEN'))return'beAlien';if(n.includes(' GO')||n.includes('_GO')||/\bGO\b/.test(n))return'GO';return null;}
function setupCacheKey(c,v){return c+"\u0000"+v}function invalidateCurrentSetupCache(){setupCache.delete(setupCacheKey(currentCar.category,currentCar.vehicle))}
async function getCarSetups(category,vehicle){const key=setupCacheKey(category,vehicle),hit=setupCache.get(key);if(hit&&Date.now()-hit.time<SETUP_CACHE_MS)return hit.data;if(setupPending.has(key))return setupPending.get(key);const p=(async()=>{const r=await fetch(`/api/setups?category=${encodeURIComponent(category)}&vehicle=${encodeURIComponent(vehicle)}`,{cache:"no-store",credentials:"same-origin"});const d=await r.json();if(!d.success)throw new Error(d.error||"Fehler beim Laden.");setupCache.set(key,{time:Date.now(),data:d});return d})().finally(()=>setupPending.delete(key));setupPending.set(key,p);return p}
function groupSetups(items){const groups=new Map();for(const s of items){const parts=[];if(s.series)parts.push(s.series);if(s.variant&&s.variant!=="Standard")parts.push(s.variant);const key=parts.length?parts.join(" · "):"Standard";if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s)}return groups}
let currentCarSetups=[];
function renderSetups(setups){
  const list=$("setupList");
  list.innerHTML='';
  const mfr=activeMfr;
  const track=trackSearchVal.trim().toLowerCase();
  const filtered=setups.filter(s=>{
    const vendor=classifyVendor(s.name);
    if(mfr&&vendor!==mfr)return false;
    if(track&&!s.name.toLowerCase().includes(track))return false;
    return true;
  });
  if(!filtered.length){list.innerHTML='<div class="empty">'+(setups.length?'Keine Setups für diesen Filter.':'Noch keine Setups für dieses Fahrzeug verfügbar.')+'</div>';return;}
  for(const [group,items] of groupSetups(filtered)){
    const wrap=document.createElement('section');wrap.className='setup-group';
    const title=document.createElement('div');title.className='setup-group-title';title.textContent=group;wrap.appendChild(title);
    items.forEach(s=>{
      const el=document.createElement('div');el.className='setup';
      const info=document.createElement('div');info.className='setup-info';
      const name=document.createElement('div');name.className='setup-track';
      const vendor=classifyVendor(s.name);
      const tag=vendor?'<span class="vendor-tag '+vendor+'">'+vendor+'</span>':'';
      name.innerHTML=esc(s.name)+tag;
      const meta=document.createElement('div');meta.className='setup-meta';
      meta.textContent=[s.series,s.variant,'ZIP'].filter(Boolean).join(' · ');
      info.append(name,meta);
      const actions=document.createElement('div');actions.className='setup-actions';
      const dl=document.createElement('a');dl.className='download';dl.href=s.download;dl.download='';dl.textContent='Download';actions.appendChild(dl);
      if(currentUser?.canUpload){const del=document.createElement('button');del.className='delete-btn';del.style.display='flex';del.title='Setup löschen';del.setAttribute('aria-label','Setup löschen');del.textContent='🗑';del.addEventListener('click',()=>openDeleteModal(s.name));actions.appendChild(del);}
      el.append(info,actions);wrap.appendChild(el);
    });
    list.appendChild(wrap);
  }
}
async function loadCarSetups(category,vehicle){const list=$("setupList");list.innerHTML='<div class="empty">Setups werden geladen...</div>';try{const d=await getCarSetups(category,vehicle);list.innerHTML='';currentCarSetups=d.setups;renderSetups(d.setups)}catch(e){list.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
const MAX_UPLOAD_BYTES=25*1024*1024;
function uploadRow(statuses,name){return [...statuses.querySelectorAll(".file-status")].find(x=>x.dataset.name===name)}
function markUploadJob(statuses,job,cls,text){job.state=cls;const x=uploadRow(statuses,job.file.name);if(x){x.className="file-status "+(cls==="ok"?"ok":cls==="err"?"err":"");x.textContent=job.file.name+" — "+text}}
async function uploadSingleJob(job,statuses){const file=job.file;if(!/\.zip$/i.test(file.name)){job.error="ungültiger Dateityp";markUploadJob(statuses,job,"err","Fehlgeschlagen");return false}if(file.size<=0||file.size>MAX_UPLOAD_BYTES){job.error="ungültige Dateigröße";markUploadJob(statuses,job,"err","Fehlgeschlagen");return false}markUploadJob(statuses,job,"uploading","Wird hochgeladen...");const form=new FormData();form.append("category",currentCar.category);form.append("vehicle",currentCar.vehicle);form.append("files",file,file.name);try{const r=await fetch("/api/setups/upload",{method:"POST",body:form,credentials:"same-origin"});let d={};try{d=await r.json()}catch{job.error="Ungültige Server-Antwort";markUploadJob(statuses,job,"err","Fehlgeschlagen");return false}const uploaded=new Set((d.uploaded||[]).map(x=>x.name));const fileError=(d.errors||[]).find(x=>x.name===file.name)?.error;if(r.ok&&uploaded.has(file.name)){job.error="";markUploadJob(statuses,job,"ok","Erfolgreich");return true}job.error=fileError||d.error||`fehlgeschlagen (HTTP ${r.status})`;markUploadJob(statuses,job,"err","Fehlgeschlagen");return false}catch{job.error="Netzwerkfehler";markUploadJob(statuses,job,"err","Fehlgeschlagen");return false}}
async function refreshUploadedCarState(category,vehicle){setupCache.delete(setupCacheKey(category,vehicle));setupPending.delete(setupCacheKey(category,vehicle));const d=await getCarSetups(category,vehicle);if(currentCar.category===category&&currentCar.vehicle===vehicle){currentCarSetups=d.setups;renderSetups(d.setups)}if(typeof refreshVehicleCounts==='function')await refreshVehicleCounts();}
async function runUploadJobs(jobs,{appendRows=false}={}){if(uploadQueueRunning)return{ok:0,failed:jobs.length,failedJobs:jobs};uploadQueueRunning=true;const status=$("uploadStatus"),statuses=$("fileStatuses"),btn=$("uploadBtn"),retryBtn=$("retryFailedBtn"),uploadCategory=currentCar.category,uploadVehicle=currentCar.vehicle;if(!appendRows)statuses.innerHTML="";for(const job of jobs){let x=uploadRow(statuses,job.file.name);if(!x){x=document.createElement("div");x.className="file-status";x.dataset.name=job.file.name;statuses.appendChild(x)}x.textContent=job.file.name+" — Wartet";x.className="file-status";job.state="waiting";job.error=""}btn.disabled=true;retryBtn.disabled=true;retryBtn.classList.remove("show");let done=0,ok=0,failed=0,refreshError=false;const updateSummary=current=>{status.textContent=(current?`Aktuell: ${current} · `:"")+`${done}/${jobs.length} verarbeitet · ${ok} erfolgreich · ${failed} fehlgeschlagen`};updateSummary("");try{for(const job of jobs){updateSummary(job.file.name);const success=await uploadSingleJob(job,statuses);if(success)ok++;else failed++;done++;updateSummary("")}if(ok){try{await refreshUploadedCarState(uploadCategory,uploadVehicle)}catch{refreshError=true}}}finally{uploadQueueRunning=false;btn.disabled=false;retryBtn.disabled=false;const failedJobs=jobs.filter(job=>job.state==="err");if(failedJobs.length)retryBtn.classList.add("show");else retryBtn.classList.remove("show");status.textContent=`${ok} erfolgreich · ${failed} fehlgeschlagen`+(refreshError?" · Anzeige konnte nicht aktualisiert werden.":"")}return{ok,failed,failedJobs,refreshError}}
$("uploadBtn").addEventListener("click",()=>{if(!uploadQueueRunning)$("fileInput").click()});$("fileInput").addEventListener("change",async function(){if(uploadQueueRunning){this.value="";return}const files=[...this.files],status=$("uploadStatus");if(!files.length)return;if(files.length>50){status.textContent="Maximal 50 ZIP-Dateien gleichzeitig.";this.value="";return}lastUploadJobs=files.map(file=>({file,state:"waiting",error:""}));await runUploadJobs(lastUploadJobs);this.value=""})
$("retryFailedBtn").addEventListener("click",async()=>{if(uploadQueueRunning)return;const failed=lastUploadJobs.filter(job=>job.state==="err");if(!failed.length){$("retryFailedBtn").classList.remove("show");return}await runUploadJobs(failed,{appendRows:true})})
function openDeleteModal(name){pendingDelete=name;$("deleteModalText").textContent=`Möchtest du „${name}“ wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.`;$("deleteModal").classList.add("show")}function closeDeleteModal(){pendingDelete=null;$("deleteModal").classList.remove("show")}$("deleteCancel").addEventListener("click",closeDeleteModal);$("deleteModal").addEventListener("click",e=>{if(e.target===$("deleteModal"))closeDeleteModal()});$("deleteConfirm").addEventListener("click",async()=>{if(!pendingDelete)return;$("deleteConfirm").disabled=true;try{const r=await fetch("/api/setups/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({category:currentCar.category,vehicle:currentCar.vehicle,name:pendingDelete})});const d=await r.json();if(!d.success)throw new Error(d.error||"Löschen fehlgeschlagen.");closeDeleteModal();invalidateCurrentSetupCache();await loadCarSetups(currentCar.category,currentCar.vehicle)}catch(e){$("deleteModalText").textContent=e.message}finally{$("deleteConfirm").disabled=false}})
$("search").addEventListener("input",e=>renderCategories(e.target.value));
document.querySelectorAll('#classFilter .mfr-btn').forEach(btn=>btn.addEventListener('click',()=>{activeClass=btn.dataset.class||'';document.querySelectorAll('#classFilter .mfr-btn').forEach(b=>b.classList.toggle('active',b===btn));renderCategories($("search").value)}));
$("trackSearch").addEventListener("input",e=>{trackSearchVal=e.target.value;renderSetups(currentCarSetups)});
document.querySelectorAll('#mfrFilter .mfr-btn').forEach(btn=>btn.addEventListener('click',()=>{activeMfr=btn.dataset.mfr||'';document.querySelectorAll('#mfrFilter .mfr-btn').forEach(b=>b.classList.toggle('active',b===btn));if($("carPage").classList.contains('active'))renderSetups(currentCarSetups)}));
$("requestForm").addEventListener("submit",async e=>{e.preventDefault();const out=$("requestResult");out.textContent="Wird gesendet...";try{const r=await fetch("/api/request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vehicle:$("reqVehicle").value.trim(),carClass:$("reqClass").value.trim(),track:$("reqTrack").value.trim(),message:$("reqMsg").value.trim()})});const d=await r.json();out.textContent=d.success?"Setup Request wurde gesendet.":d.error||"Request fehlgeschlagen.";if(d.success)e.target.reset()}catch{out.textContent="Request fehlgeschlagen."}})
async function grantUploadAccess(){await adminAccess("POST")}async function revokeUploadAccess(){await adminAccess("DELETE")}async function adminAccess(method){const id=$("adminUserId").value.trim(),out=$("adminResult");if(!id){out.textContent="Discord User ID fehlt.";return}try{const r=await fetch("/api/admin/upload-access",{method,headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:id})});const d=await r.json();out.textContent=d.success?(method==="POST"?"Upload freigegeben.":"Freigabe entfernt."):d.error||"Fehler."}catch{out.textContent="Fehler."}}async function registerRequestCommand(){const out=$("adminResult");out.textContent="Wird registriert...";try{const r=await fetch("/api/admin/discord/register-request",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});const d=await r.json();out.textContent=d.success?"/request registriert.":d.error||"Fehler."}catch{out.textContent="Fehler."}}
loadTheme();initManufacturer();checkLogin();loadData();
</script>
