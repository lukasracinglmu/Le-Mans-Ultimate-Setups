<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMU Setups</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f5f5f5;
  --surface: #ffffff;
  --surface-2: #f0f0f0;
  --text: #111111;
  --muted: #666666;
  --border: #dddddd;
  --accent: #5865f2;
}

[data-theme="dark"] {
  --bg: #111111;
  --surface: #191919;
  --surface-2: #222222;
  --text: #f5f5f5;
  --muted: #999999;
  --border: #303030;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

header {
  height: 64px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .5px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 13px;
  cursor: pointer;
}

button:hover {
  background: var(--surface-2);
}

.discord-button {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.discord-button:hover {
  background: #4752c4;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 24px 80px;
}

.hero {
  margin-bottom: 40px;
}

.hero h1 {
  margin: 0 0 10px;
  font-size: 42px;
  letter-spacing: -1px;
}

.hero p {
  margin: 0;
  color: var(--muted);
  font-size: 17px;
}

.search {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  margin-bottom: 35px;
}

.search:focus {
  border-color: var(--accent);
}

.category {
  margin-bottom: 42px;
}

.category h2 {
  font-size: 21px;
  margin-bottom: 16px;
}

.vehicle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.vehicle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 18px;
  cursor: pointer;
  transition: border-color .15s ease;
}

.vehicle:hover {
  border-color: var(--accent);
}

.vehicle-name {
  font-weight: 600;
}

.vehicle-class {
  margin-top: 7px;
  color: var(--muted);
  font-size: 13px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.back {
  margin-bottom: 25px;
}

.car-title {
  margin-bottom: 8px;
}

.car-subtitle {
  color: var(--muted);
  margin-bottom: 30px;
}

.setup {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 17px 18px;
  margin-bottom: 10px;
}

.setup-info {
  min-width: 0;
}

.setup-track {
  font-weight: 600;
}

.setup-meta {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}

.download {
  white-space: nowrap;
  text-decoration: none;
  background: var(--text);
  color: var(--bg);
  padding: 9px 13px;
  border-radius: 7px;
  font-size: 14px;
}

.empty {
  color: var(--muted);
  padding: 25px 0;
}

.account {
  display: none;
  align-items: center;
  gap: 8px;
}

.account-name {
  font-size: 14px;
  color: var(--muted);
}

.request-section {
  margin-top: 55px;
  padding-top: 35px;
  border-top: 1px solid var(--border);
}

.request-section h2 {
  margin-top: 0;
}

.request-form {
  max-width: 650px;
}

.request-form label {
  display: block;
  margin: 18px 0 7px;
  font-size: 14px;
  font-weight: 600;
}

.request-form input,
.request-form textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  background: var(--surface);
  color: var(--text);
  outline: none;
}

.request-form textarea {
  min-height: 120px;
  resize: vertical;
}

.request-message {
  margin-top: 12px;
  font-size: 14px;
}

.hidden {
  display: none !important;
}

.login-required {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 25px;
  color: var(--muted);
}

@media (max-width: 650px) {
  header {
    padding: 0 15px;
  }

  main {
    padding: 40px 15px 60px;
  }

  .hero h1 {
    font-size: 34px;
  }

  .account-name {
    display: none;
  }

  .setup {
    align-items: flex-start;
    flex-direction: column;
  }

  .download {
    width: 100%;
    text-align: center;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">LMU SETUPS</div>

  <div class="header-actions">
    <div id="account" class="account">
      <span id="accountName" class="account-name"></span>
      <button onclick="logout()">Logout</button>
    </div>

    <a id="loginButton"
       href="/auth/discord"
       style="text-decoration:none;">
      <button class="discord-button">Mit Discord anmelden</button>
    </a>

    <button onclick="toggleTheme()" id="themeButton">Dark Mode</button>
  </div>
</header>

<main>

  <!-- HOME -->
  <section id="homePage" class="page active">

    <div class="hero">
      <h1>LMU Setups</h1>
      <p>Setups für Le Mans Ultimate.</p>
    </div>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Fahrzeug suchen..."
      oninput="searchVehicles()"
    >

    <div id="categories"></div>

    <div class="request-section">

      <h2>Setup Request</h2>

      <div id="requestLoginRequired" class="login-required">
        Melde dich mit Discord an, um einen Setup Request zu senden.
      </div>

      <form id="requestForm" class="request-form hidden">

        <label for="requestVehicle">Fahrzeug</label>
        <input
          id="requestVehicle"
          type="text"
          placeholder="z. B. Porsche 963"
          required
        >

        <label for="requestTrack">Strecke</label>
        <input
          id="requestTrack"
          type="text"
          placeholder="z. B. Le Mans"
          required
        >

        <label for="requestMessage">Nachricht (optional)</label>
        <textarea
          id="requestMessage"
          placeholder="z. B. Bitte ein stabiles Wet-Setup."
        ></textarea>

        <button type="submit" class="discord-button">
          Request senden
        </button>

        <div id="requestMessageResult" class="request-message"></div>

      </form>

    </div>

  </section>

  <!-- CAR PAGE -->
  <section id="carPage" class="page">

    <button class="back" onclick="showHome()">← Zurück</button>

    <h1 id="carTitle" class="car-title"></h1>
    <div id="carSubtitle" class="car-subtitle"></div>

    <div id="setupList"></div>

  </section>

</main>

<script>
let setupData = {};
let currentUser = null;

const categoriesContainer =
  document.getElementById("categories");

const searchInput =
  document.getElementById("search");

const requestForm =
  document.getElementById("requestForm");

const requestLoginRequired =
  document.getElementById("requestLoginRequired");

async function loadSetups() {
  try {
    const response = await fetch("setups.json");

    if (!response.ok) {
      throw new Error("setups.json konnte nicht geladen werden.");
    }

    setupData = await response.json();

    renderCategories();

  } catch (error) {
    categoriesContainer.innerHTML =
      `<div class="empty">Setups konnten nicht geladen werden.</div>`;

    console.error(error);
  }
}

function renderCategories(filter = "") {

  categoriesContainer.innerHTML = "";

  const search =
    filter.trim().toLowerCase();

  Object.entries(setupData).forEach(
    ([category, vehicles]) => {

      const filteredVehicles =
        vehicles.filter(vehicle =>
          vehicle.name.toLowerCase().includes(search)
        );

      if (!filteredVehicles.length) {
        return;
      }

      const section =
        document.createElement("section");

      section.className = "category";

      section.innerHTML =
        `<h2>${escapeHtml(category)}</h2>`;

      const grid =
        document.createElement("div");

      grid.className = "vehicle-grid";

      filteredVehicles.forEach(vehicle => {

        const card =
          document.createElement("div");

        card.className = "vehicle";

        card.innerHTML = `
          <div class="vehicle-name">
            ${escapeHtml(vehicle.name)}
          </div>
          <div class="vehicle-class">
            ${escapeHtml(category)}
          </div>
        `;

        card.onclick = () =>
          showCar(category, vehicle.name);

        grid.appendChild(card);
      });

      section.appendChild(grid);
      categoriesContainer.appendChild(section);
    }
  );

  if (!categoriesContainer.children.length) {
    categoriesContainer.innerHTML =
      `<div class="empty">Kein Fahrzeug gefunden.</div>`;
  }
}

function searchVehicles() {
  renderCategories(searchInput.value);
}

function showCar(category, vehicleName) {

  const vehicle =
    setupData[category].find(
      item => item.name === vehicleName
    );

  if (!vehicle) {
    return;
  }

  document.getElementById("homePage")
    .classList.remove("active");

  document.getElementById("carPage")
    .classList.add("active");

  document.getElementById("carTitle")
    .textContent = vehicle.name;

  document.getElementById("carSubtitle")
    .textContent = category;

  const list =
    document.getElementById("setupList");

  list.innerHTML = "";

  if (!vehicle.setups || vehicle.setups.length === 0) {

    list.innerHTML =
      `<div class="empty">
        Noch keine Setups für dieses Fahrzeug verfügbar.
      </div>`;

    return;
  }

  vehicle.setups.forEach(setup => {

    const element =
      document.createElement("div");

    element.className = "setup";

    element.innerHTML = `
      <div class="setup-info">
        <div class="setup-track">
          ${escapeHtml(setup.track)}
        </div>

        <div class="setup-meta">
          v${escapeHtml(setup.version)}
          · ${escapeHtml(setup.date)}
        </div>
      </div>

      <a
        class="download"
        href="${escapeAttribute(setup.download)}"
        download
      >
        Download
      </a>
    `;

    list.appendChild(element);
  });
}

function showHome() {

  document.getElementById("carPage")
    .classList.remove("active");

  document.getElementById("homePage")
    .classList.add("active");
}

async function checkLogin() {

  try {

    const response =
      await fetch("/api/me", {
        cache: "no-store"
      });

    const data =
      await response.json();

    if (data.loggedIn) {

      currentUser = data.user;

      document.getElementById("loginButton")
        .classList.add("hidden");

      document.getElementById("account")
        .style.display = "flex";

      document.getElementById("accountName")
        .textContent =
          data.user.username;

      requestLoginRequired
        .classList.add("hidden");

      requestForm
        .classList.remove("hidden");

    } else {

      currentUser = null;

      document.getElementById("loginButton")
        .classList.remove("hidden");

      document.getElementById("account")
        .style.display = "none";

      requestLoginRequired
        .classList.remove("hidden");

      requestForm
        .classList.add("hidden");
    }

  } catch (error) {

    console.error(
      "Login Status konnte nicht geprüft werden.",
      error
    );
  }
}

async function logout() {
  window.location.href = "/auth/logout";
}

requestForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const result =
      document.getElementById(
        "requestMessageResult"
      );

    result.textContent =
      "Request wird gesendet...";

    const vehicle =
      document.getElementById(
        "requestVehicle"
      ).value.trim();

    const track =
      document.getElementById(
        "requestTrack"
      ).value.trim();

    const message =
      document.getElementById(
        "requestMessage"
      ).value.trim();

    try {

      const response =
        await fetch("/api/request", {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            vehicle,
            track,
            message
          })
        });

      const data =
        await response.json();

      if (!response.ok || !data.success) {

        result.textContent =
          data.error ||
          "Request konnte nicht gesendet werden.";

        return;
      }

      result.textContent =
        "Setup Request wurde erfolgreich gesendet.";

      requestForm.reset();

    } catch (error) {

      console.error(error);

      result.textContent =
        "Fehler beim Senden des Requests.";
    }
  }
);

function toggleTheme() {

  const current =
    document.documentElement
      .getAttribute("data-theme");

  const next =
    current === "dark"
      ? "light"
      : "dark";

  document.documentElement
    .setAttribute(
      "data-theme",
      next
    );

  localStorage.setItem(
    "lmu-theme",
    next
  );

  document.getElementById(
    "themeButton"
  ).textContent =
    next === "dark"
      ? "Light Mode"
      : "Dark Mode";
}

function loadTheme() {

  const saved =
    localStorage.getItem("lmu-theme");

  const theme =
    saved || "light";

  document.documentElement
    .setAttribute(
      "data-theme",
      theme
    );

  document.getElementById(
    "themeButton"
  ).textContent =
    theme === "dark"
      ? "Light Mode"
      : "Dark Mode";
}

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

loadTheme();
loadSetups();
checkLogin();
</script>

</body>
</html>
