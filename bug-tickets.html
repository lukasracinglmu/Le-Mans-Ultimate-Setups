<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light">
<title>Bug Tickets · Three Peaks Racing</title><link rel="icon" href="/assets/header-logo.webp?v=3p1" type="image/webp">
<style>
*{box-sizing:border-box}:root{--bg:#0e1014;--surface:#171a20;--surface2:#1e222a;--surface3:#252a33;--text:#f3f5f7;--muted:#949ba8;--border:#303640;--accent:#5b6ff5;--accent-soft:rgba(91,111,245,.13);--ok:#36b36b;--ok-soft:rgba(54,179,107,.13);--shadow:0 18px 45px rgba(0,0,0,.24)}[data-theme=light]{--bg:#f3f5f8;--surface:#fff;--surface2:#f7f8fa;--surface3:#eef1f5;--text:#15181d;--muted:#69717d;--border:#dfe3e8;--accent-soft:#eef0ff;--ok-soft:#eaf8ef;--shadow:0 15px 38px rgba(26,33,45,.08)}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,Helvetica,sans-serif}button,textarea{font:inherit}header{height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 26px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:800}.brand img{width:48px;height:28px;object-fit:contain}.back{color:var(--text);text-decoration:none;padding:9px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}main{max-width:1380px;margin:0 auto;padding:36px 28px 70px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{font-size:30px;letter-spacing:-.5px;margin:0 0 6px}.muted{color:var(--muted)}.tabs{display:flex;gap:5px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;width:max-content;margin-bottom:18px}.tabs button{border:0;border-radius:7px;background:transparent;color:var(--muted);padding:9px 16px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--surface3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}.ticket-shell{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}.ticket-table{width:100%;border-collapse:collapse;table-layout:fixed}.ticket-table th{height:42px;padding:0 14px;text-align:left;background:var(--surface2);border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:800}.ticket-table td{height:54px;padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticket-row{cursor:pointer;transition:background .12s ease}.ticket-row:hover{background:var(--surface2)}.ticket-row.selected{background:var(--accent-soft)}.ticket-number{font-weight:800;color:#8da0ff}.ticket-subject{font-weight:700;color:var(--text)}.status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.open{background:var(--accent-soft);color:#8497ff}.status.closed{background:var(--ok-soft);color:#58c981}.empty{padding:34px 18px;text-align:center;color:var(--muted)}.detail{border-top:1px solid var(--border);background:var(--surface2);padding:0}.detail-card{padding:26px 28px}.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.detail-top h2{font-size:23px;margin:0 0 6px}.detail-meta{color:var(--muted);font-size:13px}.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px}.message-card,.info-card{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:18px}.message-card h3,.info-card h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 13px}.description{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}.detail img{display:block;max-width:100%;max-height:520px;margin-top:18px;border:1px solid var(--border);border-radius:9px}.info-line{padding:9px 0;border-bottom:1px solid var(--border)}.info-line:last-child{border:0}.info-line span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.info-line strong{font-size:13px;overflow-wrap:anywhere}.reply{margin-top:18px;border-top:1px solid var(--border);padding-top:18px}.reply label{display:block;font-weight:800;margin-bottom:8px}textarea{resize:vertical;min-height:115px;width:100%;padding:12px 13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.close-ticket{margin-top:10px;border:0;border-radius:8px;background:var(--ok);color:#fff;font-weight:800;padding:10px 15px;cursor:pointer}.close-ticket:disabled{opacity:.55;cursor:wait}#message{margin-top:9px;color:var(--muted);font-size:13px}@media(max-width:850px){main{padding:25px 14px 55px}.ticket-table th:nth-child(4),.ticket-table td:nth-child(4){display:none}.detail-grid{grid-template-columns:1fr}.detail-card{padding:20px}.page-head{align-items:flex-start;flex-direction:column}}@media(max-width:600px){header{padding:0 14px}.brand span{display:none}.ticket-table th:nth-child(3),.ticket-table td:nth-child(3){display:none}.ticket-table th,.ticket-table td{padding-left:10px;padding-right:10px}.page-head h1{font-size:26px}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tpr-theme')==='light'?'light':'dark'}catch{}</script>
</head><body>
<header><div class="brand"><img src="/assets/header-logo.webp" alt="Three Peaks Racing"><span>Three Peaks Racing</span></div><a class="back" href="/">Zur Datenbank</a></header>
<main><div class="page-head"><div><h1>Tickets</h1><div class="muted">Bugmeldungen und Bearbeitungsstatus</div></div></div><div class="tabs"><button id="openTab" class="active" type="button">Offen</button><button id="closedTab" type="button">Geschlossen</button></div><div class="ticket-shell"><div id="ticketList"><div class="empty">Tickets werden geladen…</div></div><section id="ticketDetail" class="detail"></section></div></main>
<script>
(()=>{const list=document.getElementById('ticketList'),detail=document.getElementById('ticketDetail'),openTab=document.getElementById('openTab'),closedTab=document.getElementById('closedTab');let status='open',selected=null,busy=false,tickets=[];const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');const label=id=>'Ticket '+String(id).padStart(4,'0');const number=id=>String(id).padStart(4,'0');const date=v=>{if(!v)return '—';const d=new Date(String(v).replace(' ','T')+'Z');return Number.isNaN(d.getTime())?esc(v):d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});};const subject=t=>{const text=String(t.description||'').replace(/\s+/g,' ').trim();return text.length>80?text.slice(0,77)+'…':text||'Bugmeldung';};function setTab(next){status=next;openTab.classList.toggle('active',next==='open');closedTab.classList.toggle('active',next==='closed');selected=null;detail.innerHTML='';load();}openTab.onclick=()=>setTab('open');closedTab.onclick=()=>setTab('closed');async function load(){list.innerHTML='<div class="empty">Tickets werden geladen…</div>';detail.innerHTML='';try{const r=await fetch('/api/admin/bug-tickets?status='+status,{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Tickets konnten nicht geladen werden.');tickets=d.tickets||[];render();}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}function render(){if(!tickets.length){list.innerHTML='<div class="empty">'+(status==='open'?'Keine offenen Tickets.':'Keine geschlossenen Tickets.')+'</div>';return;}list.innerHTML='<table class="ticket-table"><colgroup><col style="width:120px"><col><col style="width:190px"><col style="width:180px"><col style="width:120px"></colgroup><thead><tr><th>Ticket-Nr.</th><th>Thema</th><th>Von</th><th>Aktualisiert</th><th>Status</th></tr></thead><tbody>'+tickets.map(t=>'<tr class="ticket-row'+(selected===t.id?' selected':'')+'" data-id="'+t.id+'"><td><span class="ticket-number">#'+number(t.id)+'</span></td><td><span class="ticket-subject">'+esc(subject(t))+'</span></td><td>'+esc(t.reporter_name)+'</td><td>'+date(t.closed_at||t.created_at)+'</td><td><span class="status '+(t.status==='open'?'open':'closed')+'">'+(t.status==='open'?'Offen':'Geschlossen')+'</span></td></tr>').join('')+'</tbody></table>';list.querySelectorAll('[data-id]').forEach(row=>row.onclick=()=>show(Number(row.dataset.id)));}async function show(id){selected=id;render();detail.innerHTML='<div class="empty">Ticket wird geladen…</div>';try{const r=await fetch('/api/admin/bug-tickets/'+id,{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ticket)throw Error(d.error||'Ticket konnte nicht geladen werden.');const t=d.ticket;detail.innerHTML='<div class="detail-card"><div class="detail-top"><div><h2>'+label(t.id)+'</h2><div class="detail-meta">'+esc(subject(t))+'</div></div><span class="status '+(t.status==='open'?'open':'closed')+'">'+(t.status==='open'?'Offen':'Geschlossen')+'</span></div><div class="detail-grid"><div class="message-card"><h3>Bugmeldung</h3><div class="description">'+esc(t.description)+'</div>'+(t.has_image?'<img src="/api/admin/bug-tickets/'+t.id+'/image" alt="Angehängtes Bug-Bild">':'')+(t.status==='open'?'<div class="reply"><label for="ticketMessage">Nachricht</label><textarea id="ticketMessage" minlength="3" maxlength="2000" placeholder="Nachricht an den Ersteller des Tickets"></textarea><button id="closeTicket" class="close-ticket" type="button">Ticket schließen & Nachricht senden</button><div id="message"></div></div>':'<div class="reply"><strong>Nachricht</strong><div class="description" style="margin-top:8px">'+esc(t.resolution||'')+'</div></div>')+'</div><aside class="info-card"><h3>Ticket Details</h3><div class="info-line"><span>Ticket-Nr.</span><strong>#'+number(t.id)+'</strong></div><div class="info-line"><span>Von</span><strong>'+esc(t.reporter_name)+'</strong></div><div class="info-line"><span>Discord ID</span><strong>'+esc(t.reporter_id)+'</strong></div><div class="info-line"><span>Erstellt</span><strong>'+date(t.created_at)+'</strong></div>'+(t.status==='closed'?'<div class="info-line"><span>Geschlossen</span><strong>'+date(t.closed_at)+'</strong></div>':'')+'</aside></div></div>';const close=document.getElementById('closeTicket');if(close)close.onclick=()=>closeTicket(t.id);}catch(e){detail.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}async function closeTicket(id){if(busy)return;const input=document.getElementById('ticketMessage'),message=document.getElementById('message'),resolution=input.value.trim();if(resolution.length<3){message.textContent='Bitte mindestens 3 Zeichen eingeben.';return;}busy=true;input.disabled=true;document.getElementById('closeTicket').disabled=true;try{const r=await fetch('/api/admin/bug-tickets/'+id+'/close',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolution})}),d=await r.json();if(!r.ok)throw Error(d.error||'Ticket konnte nicht geschlossen werden.');status='closed';openTab.classList.remove('active');closedTab.classList.add('active');await load();await show(id);}catch(e){message.textContent=e.message;input.disabled=false;document.getElementById('closeTicket').disabled=false;}finally{busy=false;}}load();})();
</script></body></html>
