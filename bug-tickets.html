<!doctype html><html lang="de" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bug Tickets · Three Peaks Racing</title><link rel="icon" href="/assets/header-logo.webp?v=3p1"><style>*{box-sizing:border-box}:root{--bg:#0e1014;--surface:#171a20;--surface2:#1e222a;--text:#f3f5f7;--muted:#949ba8;--border:#303640;--accent:#5b6ff5;--ok:#36b36b;--danger:#e34b4b;--progress:#d88725;--progress-bg:rgba(216,135,37,.14)}[data-theme=light]{--bg:#f3f5f8;--surface:#fff;--surface2:#f7f8fa;--text:#15181d;--muted:#69717d;--border:#dfe3e8;--progress-bg:#fff2df}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial}button,input,select,textarea{font:inherit}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--text);text-decoration:none;cursor:pointer}.brand img{width:48px}.back{color:var(--text);text-decoration:none;padding:9px 13px;border:1px solid var(--border);border-radius:8px}main{max-width:1380px;margin:auto;padding:36px 28px 70px}h1{font-size:30px;margin:0 0 6px}.muted{color:var(--muted)}.tabs{display:flex;gap:5px;margin:24px 0 12px}.tabs button,.action{padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font-weight:700}.tabs .active{background:var(--accent);border-color:var(--accent);color:#fff}.tabs #progressTab.active{background:var(--progress);border-color:var(--progress)}.searchbar{margin:0 0 18px;position:relative;max-width:460px}.searchbar input{width:100%;height:42px;padding:10px 42px 10px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);outline:none}.searchbar input:focus{border-color:var(--accent)}.searchbar svg{position:absolute;right:13px;top:12px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}.shell{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}table{width:100%;border-collapse:collapse;table-layout:fixed}th{height:42px;padding:0 12px;text-align:left;background:var(--surface2);color:var(--muted);font-size:12px}td{height:54px;padding:8px 12px;border-top:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{cursor:pointer}.row:hover{background:var(--surface2)}.row.in-progress{background:var(--progress-bg);box-shadow:inset 4px 0 0 var(--progress)}.row.in-progress:hover{background:rgba(216,135,37,.22)}.delete-row{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;line-height:1;border-radius:6px}.delete-row:hover{background:var(--danger);color:#fff}.nr{color:#fff;font-weight:800}.row.in-progress .nr,.row.closed .nr{color:#fff}.prio{font-weight:800}.Low{color:#58c981}.Medium{color:#e8b84e}.High{color:#ff6565}.status-progress{color:#f0a43b;font-weight:800}.detail{border-top:1px solid var(--border);background:var(--surface2);padding:24px}.grid{display:grid;grid-template-columns:1fr 280px;gap:22px}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}.card.progress-card{border-color:var(--progress);box-shadow:inset 4px 0 0 var(--progress)}.card h2{margin-top:0}.field{margin:0 0 14px}.field label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text)}textarea{min-height:120px;resize:vertical}.description{white-space:pre-wrap;line-height:1.6}.detail img{max-width:100%;max-height:500px;border-radius:8px;margin-top:15px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.save{background:var(--accent);border-color:var(--accent);color:#fff}.close{background:var(--ok);border-color:var(--ok);color:#fff}.progress{background:var(--progress);border-color:var(--progress);color:#fff}.reopen{background:#d88725;border-color:#d88725;color:#fff}.empty{padding:32px;text-align:center;color:var(--muted)}.info{padding:9px 0;border-bottom:1px solid var(--border)}.info span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:25px 14px}th:nth-child(4),td:nth-child(4){display:none}.searchbar{max-width:none}}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tpr-theme')==='light'?'light':'dark'}catch{}</script></head><body><header><a class="brand" href="/" aria-label="Zur Startseite"><img src="/assets/bp-logo.webp" alt="Three Peaks Racing"><span>Three Peaks Racing</span></a><a class="back" href="/">Zur Datenbank</a></header><main><h1>Tickets</h1><div class="muted">Bugmeldungen und Bearbeitungsstatus</div><div class="tabs"><button id="openTab" class="active">Offen</button><button id="progressTab">In Bearbeitung</button><button id="closedTab">Geschlossen</button></div><div class="searchbar"><input id="ticketSearch" type="search" autocomplete="off" placeholder="Tickets durchsuchen…" aria-label="Tickets durchsuchen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div><div class="shell"><div id="list"><div class="empty">Tickets werden geladen…</div></div><div id="detail"></div></div></main><script>(()=>{const list=document.getElementById('list'),detail=document.getElementById('detail'),o=document.getElementById('openTab'),p=document.getElementById('progressTab'),c=document.getElementById('closedTab'),search=document.getElementById('ticketSearch');const savedTab=sessionStorage.getItem('tpr-ticket-tab'),validTabs=['open','progress','closed'];let status=validTabs.includes(savedTab)?savedTab:'open',tickets=[],initial=!validTabs.includes(savedTab),query='';const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const date=v=>v?new Date(String(v).replace(' ','T')+'Z').toLocaleString('de-DE'):'—';const statusText=s=>s==='progress'?'In Bearbeitung':s==='closed'?'Geschlossen':'Offen';function rememberTab(){try{sessionStorage.setItem('tpr-ticket-tab',status)}catch{}}function setTabs(){o.classList.toggle('active',status==='open');p.classList.toggle('active',status==='progress');c.classList.toggle('active',status==='closed')}function tab(s){status=s;initial=false;rememberTab();setTabs();detail.innerHTML='';load()}o.onclick=()=>tab('open');p.onclick=()=>tab('progress');c.onclick=()=>tab('closed');search.addEventListener('input',()=>{query=search.value.trim().toLowerCase();detail.innerHTML='';render()});async function api(path,opt){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',...opt}),d=await r.json();if(!r.ok)throw Error(d.error||'Fehler');return d}function matches(t){if(!query)return true;const nr=String(t.id).padStart(4,'0');return [nr,'#'+nr,t.title,t.reporter_name,t.reporter_id,t.description,t.priority,statusText(t.status),t.resolution].some(v=>String(v??'').toLowerCase().includes(query))}function render(){const empty=status==='open'?'offenen':status==='progress'?'Tickets in Bearbeitung':'geschlossenen',shown=tickets.filter(matches);list.innerHTML=shown.length?'<table><colgroup><col style="width:110px"><col><col style="width:150px"><col style="width:180px"><col style="width:120px"><col style="width:48px"></colgroup><thead><tr><th>Ticket-Nr.</th><th>Thema</th><th>Von</th><th>Aktualisiert</th><th>Priorität</th><th></th></tr></thead><tbody>'+shown.map(t=>'<tr class="row '+(t.status==='progress'?'in-progress':t.status==='closed'?'closed':'')+'" data-id="'+t.id+'"><td class="nr">#'+String(t.id).padStart(4,'0')+'</td><td><b>'+esc(t.title)+'</b></td><td>'+esc(t.reporter_name)+'</td><td>'+date(t.updated_at||t.created_at)+'</td><td class="prio '+esc(t.priority)+'">'+esc(t.priority)+'</td><td>'+(t.status==='closed'?'<button type="button" class="delete-row" data-id="'+t.id+'" title="Ticket löschen" aria-label="Ticket löschen">🗑️</button>':'')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">'+(query?'Keine Tickets für „'+esc(search.value.trim())+'“ gefunden.':'Keine '+empty+'.')+'</div>';list.querySelectorAll('.row').forEach(x=>x.onclick=()=>show(x.dataset.id));list.querySelectorAll('.delete-row').forEach(x=>x.onclick=e=>{e.stopPropagation();deleteTicket(x.dataset.id)})}async function load(){try{const d=await api('/api/admin/bug-tickets?status='+status);tickets=d.tickets||[];if(initial&&status==='open'&&!tickets.length){const pd=await api('/api/admin/bug-tickets?status=progress');const progressTickets=pd.tickets||[];if(progressTickets.length){status='progress';tickets=progressTickets;initial=false;rememberTab();setTabs();render();return}}initial=false;rememberTab();render()}catch(e){initial=false;list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function show(id){try{const t=(await api('/api/admin/bug-tickets/'+id)).ticket;detail.innerHTML='<div class="detail"><div class="grid"><div class="card '+(t.status==='progress'?'progress-card':'')+'"><h2>Ticket '+String(t.id).padStart(4,'0')+'</h2><div class="field"><label>Titel</label><input id="editTitle" maxlength="120" value="'+esc(t.title)+'"></div><div class="field"><label>Beschreibung</label><textarea id="editDescription" maxlength="3500">'+esc(t.description)+'</textarea></div><div class="field"><label>Priorität</label><select id="editPriority"><option'+(t.priority==='Low'?' selected':'')+'>Low</option><option'+(t.priority==='Medium'?' selected':'')+'>Medium</option><option'+(t.priority==='High'?' selected':'')+'>High</option></select></div>'+(t.has_image?'<img src="/api/admin/bug-tickets/'+t.id+'/image">':'')+'<div class="actions"><button id="save" class="action save">Änderungen speichern</button>'+(t.status==='open'?'<button id="progress" class="action progress">In Bearbeitung setzen</button><button id="close" class="action close">Ticket schließen</button>':t.status==='progress'?'<button id="reopen" class="action reopen">Auf Offen setzen</button><button id="close" class="action close">Ticket schließen</button>':'<button id="reopen" class="action reopen">Ticket wieder öffnen</button><button id="delete" class="action" style="background:#b52f3b;border-color:#b52f3b;color:#fff">Ticket löschen</button>')+'</div><div id="extra"></div></div><aside class="card"><b>Ticket Details</b><div class="info"><span>Von</span>'+esc(t.reporter_name)+'</div><div class="info"><span>Discord ID</span>'+esc(t.reporter_id)+'</div><div class="info"><span>Status</span><b class="'+(t.status==='progress'?'status-progress':'')+'">'+statusText(t.status)+'</b></div><div class="info"><span>Priorität</span><b class="'+esc(t.priority)+'">'+esc(t.priority)+'</b></div><div class="info"><span>Erstellt</span>'+date(t.created_at)+'</div>'+(t.closed_at?'<div class="info"><span>Geschlossen</span>'+date(t.closed_at)+'</div>':'')+'</aside></div></div>';document.getElementById('save').onclick=()=>save(id);const progress=document.getElementById('progress');if(progress)progress.onclick=()=>progressTicket(id);const close=document.getElementById('close');if(close)close.onclick=()=>closeBox(id);const reopen=document.getElementById('reopen');if(reopen)reopen.onclick=()=>reopenTicket(id);const remove=document.getElementById('delete');if(remove)remove.onclick=()=>deleteTicket(id)}catch(e){detail.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function loadHistory(id){try{const d=await api('/api/admin/bug-tickets/'+id+'/history');const box=document.getElementById('history');if(!box)return;box.innerHTML='<b>Änderungsverlauf</b>'+(d.history||[]).map(x=>'<div class="info"><b>'+esc(x.action)+'</b> · '+date(x.created_at)+'<br>'+esc(x.details||'')+'</div>').join('')||'<div class="empty">Noch keine Änderungen.</div>'}catch{}}async function save(id){try{await api('/api/admin/bug-tickets/'+id+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('editTitle').value,description:document.getElementById('editDescription').value,priority:document.getElementById('editPriority').value})});await load();await show(id)}catch(e){alert(e.message)}}async function progressTicket(id){try{await api('/api/admin/bug-tickets/'+id+'/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});tab('progress');setTimeout(()=>show(id),100)}catch(e){alert(e.message)}}function closeBox(id){document.getElementById('extra').innerHTML='<div class="field" style="margin-top:18px"><label>Nachricht (optional)</label><textarea id="msg" maxlength="2000" placeholder="Leer lassen für die Standardnachricht"></textarea><button id="confirmClose" class="action close" style="margin-top:8px">Ticket schließen</button></div>';document.getElementById('confirmClose').onclick=()=>closeTicket(id)}async function closeTicket(id){try{await api('/api/admin/bug-tickets/'+id+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolution:document.getElementById('msg').value})});tab('closed')}catch(e){alert(e.message)}}async function deleteTicket(id){if(!confirm('Dieses geschlossene Ticket endgültig löschen? Die Ticketnummer wird nicht wiederverwendet.'))return;try{await api('/api/admin/bug-tickets/'+id+'/delete',{method:'DELETE'});detail.innerHTML='';load()}catch(e){alert(e.message)}}async function reopenTicket(id){try{await api('/api/admin/bug-tickets/'+id+'/reopen',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});tab('open');setTimeout(()=>show(id),100)}catch(e){alert(e.message)}}setTabs();load()})();</script></body></html>
