<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light">
<title>Bug Tickets · Three Peaks Racing</title><link rel="icon" href="/assets/header-logo.webp?v=3p1" type="image/webp">
<style>
*{box-sizing:border-box}:root{--bg:#111318;--surface:#191c22;--surface2:#22262d;--text:#f5f6f8;--muted:#a5a9b3;--border:#343943;--accent:#5865f2;--ok:#16803c}[data-theme=light]{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f1f3;--text:#17191e;--muted:#59616d;--border:#d6dae1}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,Helvetica,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 26px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:bold}.brand img{width:76px;height:38px;object-fit:contain}a{color:var(--text)}main{max-width:1050px;margin:38px auto;padding:0 20px 60px}h1{font-size:30px;margin:0 0 8px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;margin:24px 0 18px}.tabs button,button{font:inherit;padding:10px 15px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface);color:var(--text);font-weight:bold}.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}.layout{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:18px}.list,.detail{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px;min-height:320px}.ticket{width:100%;text-align:left;margin-bottom:8px;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer}.ticket:hover{border-color:var(--accent)}.ticket small{display:block;color:var(--muted);margin-top:5px}.description{white-space:pre-wrap;line-height:1.55}.detail img{display:block;max-width:100%;max-height:520px;margin:16px 0;border:1px solid var(--border);border-radius:8px}textarea{font:inherit;resize:vertical;min-height:130px;width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin:8px 0 10px}textarea:focus{outline:2px solid var(--accent)}.close{background:var(--ok);border-color:var(--ok);color:#fff}.hidden{display:none!important}#message{margin-top:10px;font-size:14px}.empty{color:var(--muted);padding:18px 4px}@media(max-width:720px){header{padding:12px 16px}.brand span{display:none}.brand img{width:54px}main{margin-top:26px}.layout{grid-template-columns:1fr}.detail{min-height:0}}
</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tpr-theme')==='light'?'light':'dark'}catch{}</script>
</head><body>
<header><div class="brand"><img src="/assets/header-logo.webp" alt="Three Peaks Racing"><span>Three Peaks Racing</span></div><a href="/">Zur Datenbank</a></header>
<main><h1>Bug Tickets</h1><div class="muted">Private Ticketübersicht</div><div class="tabs"><button id="openTab" class="active" type="button">Offen</button><button id="closedTab" type="button">Geschlossen</button></div><div class="layout"><section id="ticketList" class="list"><div class="empty">Tickets werden geladen…</div></section><section id="ticketDetail" class="detail"><div class="empty">Wähle ein Ticket aus.</div></section></div></main>
<script>
(()=>{const list=document.getElementById('ticketList'),detail=document.getElementById('ticketDetail'),openTab=document.getElementById('openTab'),closedTab=document.getElementById('closedTab');let status='open',selected=null,busy=false;const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');const label=id=>'Ticket '+String(id).padStart(4,'0');function setTab(next){status=next;openTab.classList.toggle('active',next==='open');closedTab.classList.toggle('active',next==='closed');selected=null;detail.innerHTML='<div class="empty">Wähle ein Ticket aus.</div>';load();}openTab.onclick=()=>setTab('open');closedTab.onclick=()=>setTab('closed');async function load(){list.innerHTML='<div class="empty">Tickets werden geladen…</div>';try{const r=await fetch('/api/admin/bug-tickets?status='+status,{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Tickets konnten nicht geladen werden.');list.innerHTML=(d.tickets||[]).map(t=>'<button class="ticket" type="button" data-id="'+t.id+'"><strong>'+label(t.id)+'</strong><small>'+esc(t.reporter_name)+' · '+esc(t.created_at)+'</small></button>').join('')||'<div class="empty">'+(status==='open'?'Keine offenen Tickets.':'Keine geschlossenen Tickets.')+'</div>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(Number(b.dataset.id)));}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}async function show(id){selected=id;detail.innerHTML='<div class="empty">Ticket wird geladen…</div>';try{const r=await fetch('/api/admin/bug-tickets/'+id,{credentials:'same-origin',cache:'no-store'}),d=await r.json();if(!r.ok||!d.ticket)throw Error(d.error||'Ticket konnte nicht geladen werden.');const t=d.ticket;detail.innerHTML='<h2>'+label(t.id)+'</h2><p><strong>Erstellt von:</strong> '+esc(t.reporter_name)+'</p><p><strong>Discord ID:</strong> '+esc(t.reporter_id)+'</p><p class="description">'+esc(t.description)+'</p>'+(t.has_image?'<img src="/api/admin/bug-tickets/'+t.id+'/image" alt="Angehängtes Bug-Bild">':'')+(t.status==='open'?'<label for="ticketMessage"><strong>Nachricht</strong></label><textarea id="ticketMessage" minlength="3" maxlength="2000" placeholder="Nachricht an den Ersteller des Tickets"></textarea><button id="closeTicket" class="close" type="button">Ticket schließen & Nachricht senden</button><div id="message"></div>':'<p><strong>Nachricht:</strong></p><p class="description">'+esc(t.resolution||'')+'</p><p class="muted">Geschlossen: '+esc(t.closed_at||'')+'</p>');const close=document.getElementById('closeTicket');if(close)close.onclick=()=>closeTicket(t.id);}catch(e){detail.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}async function closeTicket(id){if(busy)return;const input=document.getElementById('ticketMessage'),message=document.getElementById('message'),resolution=input.value.trim();if(resolution.length<3){message.textContent='Bitte mindestens 3 Zeichen eingeben.';return;}busy=true;input.disabled=true;document.getElementById('closeTicket').disabled=true;try{const r=await fetch('/api/admin/bug-tickets/'+id+'/close',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({resolution})}),d=await r.json();if(!r.ok)throw Error(d.error||'Ticket konnte nicht geschlossen werden.');await setClosedAfterSuccess();}catch(e){message.textContent=e.message;input.disabled=false;document.getElementById('closeTicket').disabled=false;}finally{busy=false;}}async function setClosedAfterSuccess(){status='closed';openTab.classList.remove('active');closedTab.classList.add('active');await load();if(selected)await show(selected);}load();})();
</script></body></html>
