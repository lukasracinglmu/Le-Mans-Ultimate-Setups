<!doctype html><html lang="de" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Setup Request · Three Peaks Racing</title><link rel="icon" href="/assets/header-logo.webp?v=3p1" type="image/webp"><style>*{box-sizing:border-box}:root{--bg:#111318;--surface:#191c22;--text:#f5f6f8;--muted:#a5a9b3;--border:#343943;--accent:#5865f2}[data-theme=light]{--bg:#f5f6f8;--surface:#fff;--text:#17191e;--muted:#59616d;--border:#d6dae1}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,Helvetica,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-weight:800}.brand img{width:76px;height:38px;object-fit:contain}.back{color:var(--text);text-decoration:none;font-size:13px}main{max-width:740px;margin:38px auto;padding:0 20px 70px}h1{margin:0 0 8px;font-size:30px}p{color:var(--muted);line-height:1.55}form{margin-top:24px;padding:24px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}textarea{min-height:110px;resize:vertical}button{font:inherit;padding:11px 15px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.options{display:grid;gap:5px;margin-top:5px}.option{padding:9px 11px;border:1px solid var(--border);border-radius:7px;cursor:pointer}.option:hover{border-color:var(--accent)}.hidden{display:none!important}.result{margin-top:12px;font-size:13px}@media(max-width:520px){header{padding:0 14px}.brand span{display:none}.brand img{width:58px}form{padding:18px}}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tpr-theme')==='light'?'light':'dark'}catch{}</script></head><body><header><a class="brand" href="/"><img src="/assets/bp-logo.webp" alt="Three Peaks Racing"><span>Three Peaks Racing</span></a><a class="back" href="/">Zur Datenbank</a></header><main><h1>Setup Request</h1><p>Fordere ein Setup für ein vorhandenes Fahrzeug an.</p><form id="form"><div class="field"><label for="vehicle">Fahrzeug</label><input id="vehicle" autocomplete="off" placeholder="Fahrzeug suchen…" required><div id="options" class="options hidden"></div></div><div class="field"><label for="carClass">Klasse</label><input id="carClass" readonly required></div><div class="field"><label for="track">Strecke</label><input id="track" maxlength="120" required placeholder="z. B. Spa-Francorchamps"></div><div class="field"><label for="message">Nachricht (optional)</label><textarea id="message" maxlength="1000" placeholder="Zusätzliche Informationen"></textarea></div><button type="submit">Request senden</button><div id="result" class="result" role="status"></div></form></main><script>(()=>{const form=document.getElementById('form'),vehicle=document.getElementById('vehicle'),carClass=document.getElementById('carClass'),track=document.getElementById('track'),message=document.getElementById('message'),options=document.getElementById('options'),result=document.getElementById('result');let cars=[],selected=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(me=>{if(!me.loggedIn){location.replace('/');return}return fetch('/setups.json',{credentials:'same-origin',cache:'no-store'})}).then(r=>r&&r.json()).then(data=>{if(!data)return;const groups=Array.isArray(data)?data:(data.vehicles||data.cars||data.categories||data);if(Array.isArray(groups))cars=groups.flatMap(x=>x.vehicles||x.cars||[x]).filter(x=>x&&x.name);else for(const [cls,list] of Object.entries(groups||{}))if(Array.isArray(list))cars.push(...list.map(x=>typeof x==='string'?{name:x,class:cls}:{...x,class:x.class||cls}))}).catch(()=>{});vehicle.addEventListener('input',()=>{selected=null;carClass.value='';const q=vehicle.value.trim().toLowerCase();if(q.length<2){options.classList.add('hidden');return}const hits=cars.filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);options.innerHTML=hits.map((c,i)=>`<div class="option" data-i="${i}">${esc(c.name)}${c.class?` · ${esc(c.class)}`:''}</div>`).join('');options.classList.toggle('hidden',!hits.length);options.querySelectorAll('.option').forEach((el,i)=>el.onclick=()=>{selected=hits[i];vehicle.value=selected.name;carClass.value=selected.class||selected.carClass||'';options.classList.add('hidden')})});form.addEventListener('submit',async e=>{e.preventDefault();if(!selected||selected.name!==vehicle.value.trim()){result.textContent='Bitte ein Fahrzeug aus der Liste auswählen.';return}result.textContent='Wird gesendet…';try{const r=await fetch('/api/request',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({vehicle:selected.name,carClass:carClass.value,track:track.value.trim(),message:message.value.trim()})}),d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||'Request fehlgeschlagen.');result.textContent='Setup Request wurde gesendet.';track.value='';message.value=''}catch(err){result.textContent=err.message}})})();</script></body></html>
