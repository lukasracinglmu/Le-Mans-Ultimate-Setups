<!-- @file-notes: Setup Requests mit Fahrzeug- und Streckenvorschlägen sowie Formularübermittlung. -->
<!doctype html><html lang="de" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Setup Request · Three Peaks Racing</title><link rel="icon" href="/assets/header-logo.webp?v=3p1" type="image/webp"><style>*{box-sizing:border-box}:root{--bg:#111318;--surface:#191c22;--text:#f5f6f8;--muted:#a5a9b3;--border:#343943;--accent:#5865f2}[data-theme=light]{--bg:#f5f6f8;--surface:#fff;--text:#17191e;--muted:#59616d;--border:#d6dae1}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,Helvetica,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-weight:800}.brand img{width:76px;height:38px;object-fit:contain}.back{color:var(--text);text-decoration:none;font-size:13px}main{max-width:740px;margin:38px auto;padding:0 20px 70px}h1{margin:0 0 8px;font-size:30px}p{color:var(--muted);line-height:1.55}form{margin-top:24px;padding:24px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.field{margin-bottom:18px}label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}textarea{min-height:110px;resize:vertical}button{font:inherit;padding:11px 15px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.options{display:grid;gap:5px;margin-top:5px}.option{padding:9px 11px;border:1px solid var(--border);border-radius:7px;cursor:pointer}.option:hover{border-color:var(--accent)}#trackOptions{max-height:260px;overflow-y:auto}.track-option{background:var(--bg);color:var(--text);font-weight:400;text-align:left}.track-option[aria-selected="true"]{border-color:var(--accent);outline:1px solid var(--accent)}.hidden{display:none!important}.result{margin-top:12px;font-size:13px}@media(max-width:520px){header{padding:0 14px}.brand span{display:none}.brand img{width:58px}form{padding:18px}}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tpr-theme')==='light'?'light':'dark'}catch{}</script><style id="visual-polish">button,a,.card,.user,.vehicle,.ticket,.setup-card,.manufacturer-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease}button:hover,a:not(.brand):hover{transform:translateY(-2px)}.card:hover,.user:hover,.vehicle:hover,.ticket:hover,.setup-card:hover,.manufacturer-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #0003;border-color:var(--accent,#5865f2)}</style></head><body><header><a class="brand" href="/"><img src="/assets/bp-logo.webp?v=20261023-1" alt="Three Peaks Racing"><span>Three Peaks Racing</span></a><a class="back" href="/">Zur Datenbank</a></header><main><h1>Setup Request</h1><p>Fordere ein Setup für ein vorhandenes Fahrzeug an.</p><form id="form"><div class="field"><label for="vehicle">Fahrzeug</label><input id="vehicle" autocomplete="off" placeholder="Fahrzeug suchen…" required><div id="options" class="options hidden"></div></div><div class="field"><label for="carClass">Klasse</label><input id="carClass" readonly required></div><div class="field"><label for="track">Strecke</label><input id="track" maxlength="120" required placeholder="Strecke suchen…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="trackOptions" aria-expanded="false"><div id="trackOptions" class="options hidden" role="listbox" aria-label="Streckenvorschläge"></div></div><div class="field"><label for="message">Nachricht (optional)</label><textarea id="message" maxlength="1000" placeholder="Zusätzliche Informationen"></textarea></div><button type="submit">Request senden</button><div id="result" class="result" role="status"></div></form></main><script>
(()=>{
let REQUEST_TRACKS=[];
function normalizeRequestTrack(value) {
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
}

/* Exakte Namen und gebräuchliche Kurzformen sind erlaubt; unbekannte Strecken nicht. */
function resolveRequestTrack(value) {
  const query=normalizeRequestTrack(value);
  return query?REQUEST_TRACKS.find(track=>[track.name,...track.aliases].some(name=>normalizeRequestTrack(name)===query))||null:null;
}

/* Präfixe zuerst, danach Teiltreffer; maximal 25 Vorschläge für Discord. */
function searchRequestTracks(value,limit=8) {
  const query=normalizeRequestTrack(value);
  return REQUEST_TRACKS.map((track,index)=>{
    const names=[track.name,...track.aliases].map(normalizeRequestTrack);
    const shortHit=[track.name,...track.aliases].some(name=>String(name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).some(word=>word.startsWith(query)));
    const score=!query||names.some(name=>name.startsWith(query))?0:(query.length<=3?shortHit:names.some(name=>name.includes(query)))?1:2;
    return {track,index,score};
  }).filter(item=>item.score<2).sort((a,b)=>a.score-b.score||a.index-b.index).slice(0,Math.max(0,Math.min(25,limit))).map(item=>item.track);
}


const form=document.getElementById('form'),vehicle=document.getElementById('vehicle'),carClass=document.getElementById('carClass'),track=document.getElementById('track'),message=document.getElementById('message'),options=document.getElementById('options'),result=document.getElementById('result');let cars=[],selected=null;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(me=>{if(!me.loggedIn){location.replace('/');return}return fetch('/setups.json',{credentials:'same-origin',cache:'no-store'})}).then(r=>r&&r.json()).then(data=>{if(!data)return;const groups=Array.isArray(data)?data:(data.vehicles||data.cars||data.categories||data);if(Array.isArray(groups))cars=groups.flatMap(x=>x.vehicles||x.cars||[x]).filter(x=>x&&x.name);else for(const [cls,list] of Object.entries(groups||{}))if(Array.isArray(list))cars.push(...list.map(x=>typeof x==='string'?{name:x,class:cls}:{...x,class:x.class||cls}))}).catch(()=>{});vehicle.addEventListener('input',()=>{selected=null;carClass.value='';const q=vehicle.value.trim().toLowerCase();if(q.length<2){options.classList.add('hidden');return}const hits=cars.filter(c=>c.name.toLowerCase().includes(q)).slice(0,8);options.innerHTML=hits.map((c,i)=>`<div class="option" data-i="${i}">${esc(c.name)}${c.class?` · ${esc(c.class)}`:''}</div>`).join('');options.classList.toggle('hidden',!hits.length);options.querySelectorAll('.option').forEach((el,i)=>el.onclick=()=>{selected=hits[i];vehicle.value=selected.name;carClass.value=selected.class||selected.carClass||'';options.classList.add('hidden')})});
/* Vorschläge lokal aus derselben Liste wie beim Discord-Bot; keine Anfrage pro Tastendruck. */
const trackOptions=document.getElementById('trackOptions');
let trackHits=[],activeTrack=-1;
const closeTrackOptions=()=>{trackOptions.classList.add('hidden');track.setAttribute('aria-expanded','false');track.removeAttribute('aria-activedescendant');activeTrack=-1};
const selectTrack=index=>{const hit=trackHits[index];if(!hit)return;track.value=hit.name;track.setCustomValidity('');closeTrackOptions();track.focus()};
const highlightTrack=()=>{[...trackOptions.querySelectorAll('[role="option"]')].forEach((option,index)=>option.setAttribute('aria-selected',String(index===activeTrack)));if(activeTrack<0){track.removeAttribute('aria-activedescendant');return}const option=trackOptions.querySelectorAll('[role="option"]')[activeTrack];track.setAttribute('aria-activedescendant',option.id);option.scrollIntoView({block:'nearest'})};
const showTrackOptions=()=>{
  track.setCustomValidity('');activeTrack=-1;track.removeAttribute('aria-activedescendant');
  if(track.value.trim().length<2){closeTrackOptions();return}
  trackHits=searchRequestTracks(track.value,8);trackOptions.replaceChildren();
  if(!trackHits.length){closeTrackOptions();return}
  trackHits.forEach((hit,index)=>{const option=document.createElement('button');option.type='button';option.className='option track-option';option.id='track-option-'+index;option.setAttribute('role','option');option.setAttribute('aria-selected','false');option.tabIndex=-1;option.textContent=hit.name;option.addEventListener('pointerdown',event=>event.preventDefault());option.addEventListener('click',()=>selectTrack(index));trackOptions.appendChild(option)});
  trackOptions.classList.remove('hidden');track.setAttribute('aria-expanded','true');
};
track.addEventListener('input',showTrackOptions);
track.addEventListener('focus',showTrackOptions);
track.addEventListener('keydown',event=>{
  if(event.key==='Escape'){closeTrackOptions();return}
  if(event.key==='Tab'){closeTrackOptions();return}
  if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(trackOptions.classList.contains('hidden'))showTrackOptions();if(!trackHits.length||trackOptions.classList.contains('hidden'))return;activeTrack=(activeTrack+(event.key==='ArrowDown'?1:activeTrack<0?0:-1)+trackHits.length)%trackHits.length;highlightTrack();return}
  if(event.key==='Enter'&&!trackOptions.classList.contains('hidden')){event.preventDefault();if(activeTrack>=0)selectTrack(activeTrack)}
});
track.addEventListener('blur',()=>{closeTrackOptions();const hit=resolveRequestTrack(track.value);if(hit)track.value=hit.name});
document.addEventListener('click',event=>{if(!track.parentElement.contains(event.target))closeTrackOptions()});
/* Kleine öffentliche Liste einmal laden; die bestehende Fahrzeugauswahl startet sofort. */
track.setAttribute('aria-busy','true');
fetch('/api/request/tracks',{credentials:'same-origin',cache:'no-store'}).then(response=>{if(!response.ok)throw Error();return response.json()}).then(data=>{
  if(!Array.isArray(data.tracks)||!data.tracks.length)throw Error();
  REQUEST_TRACKS=data.tracks;track.setAttribute('aria-busy','false');
  if(document.activeElement===track&&track.value.trim().length>=2)showTrackOptions();
}).catch(()=>{track.setAttribute('aria-busy','false');result.textContent='Streckenliste konnte nicht geladen werden. Bitte lade die Seite neu.'});


form.addEventListener('submit',async e=>{e.preventDefault();if(!selected||selected.name!==vehicle.value.trim()){result.textContent='Bitte ein Fahrzeug aus der Liste auswählen.';return}if(!REQUEST_TRACKS.length){result.textContent='Streckenliste noch nicht verfügbar. Bitte lade die Seite neu.';return}const selectedTrack=resolveRequestTrack(track.value);if(!selectedTrack){result.textContent='Bitte eine Strecke aus den Vorschlägen auswählen.';track.focus();return}track.value=selectedTrack.name;closeTrackOptions();result.textContent='Wird gesendet…';try{const r=await fetch('/api/request',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({vehicle:selected.name,carClass:carClass.value,track:selectedTrack.name,message:message.value.trim()})}),d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||'Request fehlgeschlagen.');result.textContent='Setup Request wurde gesendet.';track.value='';message.value=''}catch(err){result.textContent=err.message}})})();</script></body></html>
