<!doctype html><html lang="de" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Admin Panel · Three Peaks Racing</title><link rel="icon" href="/assets/header-logo.webp?v=3p1" type="image/webp"><style>*{box-sizing:border-box}:root{--bg:#111318;--surface:#191c22;--surface2:#22262d;--text:#f5f6f8;--muted:#a5a9b3;--border:#343943;--accent:#5865f2;--danger:#d92d20;--ok:#22a06b}[data-theme=light]{--bg:#f5f6f8;--surface:#fff;--surface2:#f0f1f3;--text:#17191e;--muted:#59616d;--border:#d6dae1}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,Helvetica,sans-serif}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--border);background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;font-weight:800}.brand img{width:76px;height:38px;object-fit:contain}.back{color:var(--text);text-decoration:none;font-size:13px}main{max-width:900px;margin:38px auto;padding:0 20px 70px}h1{margin:0 0 8px;font-size:30px}p{color:var(--muted);line-height:1.55}.card{margin-top:24px;padding:22px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.row{display:flex;gap:9px;flex-wrap:wrap}.row input{flex:1;min-width:240px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}button{font:inherit;padding:10px 13px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);cursor:pointer;font-weight:700}button:hover{filter:brightness(1.08)}button.danger{background:var(--danger);border-color:var(--danger);color:#fff}.status{min-height:20px;margin:12px 0 0;font-size:13px}.status.ok{color:#44cf91}.status.err{color:#ff865f}.list{display:grid;gap:9px;margin-top:14px}.user{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--border);border-radius:9px;background:var(--bg)}.meta{min-width:0}.name{font-weight:800}.details{font-size:12px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.empty{color:var(--muted);padding:12px 0}.hidden{display:none!important}@media(max-width:650px){header{padding:0 14px}.brand span{display:none}.brand img{width:58px}.user{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.row{flex-direction:column}.row input{min-width:0;width:100%}}</style><script>try{document.documentElement.dataset.theme=localStorage.getItem('tpr-theme')==='light'?'light':'dark'}catch{}</script></head><body><header><a class="brand" href="/" aria-label="Zur Startseite"><img src="/assets/header-logo.webp" alt="Three Peaks Racing"><span>Three Peaks Racing</span></a><a class="back" href="/">Zur Datenbank</a></header><main><h1>Admin Panel</h1><p>Persönliche Freigaben für die Setup Database verwalten.</p><section class="card"><h2>User freigeben</h2><div class="row"><input id="userId" inputmode="numeric" placeholder="Discord User ID" maxlength="22"><button data-action="database">Database freigeben</button><button data-action="upload">Upload/Delete freigeben</button><button data-action="all">Alles freigeben</button><button class="danger" data-action="remove">Alles entfernen</button></div><div id="status" class="status" role="status"></div></section><section class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Freigegebene User</h2><button id="refresh">Aktualisieren</button></div><div id="list" class="list"><div class="empty">Wird geladen…</div></div></section></main><script>(()=>{const input=document.getElementById('userId'),status=document.getElementById('status'),list=document.getElementById('list');const valid=()=>/^\d{16,22}$/.test(input.value.trim());const message=(text,ok=false)=>{status.textContent=text;status.className='status '+(ok?'ok':'err')};async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'same-origin',cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||'Anfrage fehlgeschlagen.');return d}async function load(){list.innerHTML='<div class="empty">Wird geladen…</div>';try{const d=await api('/api/admin/access');const users=d.users||[];if(!users.length){list.innerHTML='<div class="empty">Keine persönlichen Freigaben vorhanden.</div>';return}list.innerHTML='';for(const u of users){const card=document.createElement('div');card.className='user';const meta=document.createElement('div');meta.className='meta';const name=document.createElement('div');name.className='name';name.textContent=u.username||'Unbekannt';const details=document.createElement('div');details.className='details';details.textContent=(u.permission||'')+' · '+u.userId;meta.append(name,details);const actions=document.createElement('div');actions.className='actions';const copy=document.createElement('button');copy.textContent='Discord ID kopieren';copy.onclick=async()=>{try{await navigator.clipboard.writeText(u.userId);copy.textContent='Kopiert';setTimeout(()=>copy.textContent='Discord ID kopieren',1200)}catch{}};const remove=document.createElement('button');remove.className='danger';remove.textContent='Alles entfernen';remove.onclick=()=>change('/api/admin/all-access','DELETE',u.userId);actions.append(copy,remove);card.append(meta,actions);list.append(card)}}catch(e){list.innerHTML='<div class="empty">'+e.message+'</div>'}}async function change(path,method,id=input.value.trim()){if(!/^\d{16,22}$/.test(id)){message('Bitte eine gültige Discord User ID eingeben.');return}try{await api(path,method,{userId:id});message('Freigaben wurden aktualisiert.',true);await load()}catch(e){message(e.message)}}document.querySelector('[data-action="database"]').onclick=()=>valid()?change('/api/admin/database-access','POST'):message('Bitte eine gültige Discord User ID eingeben.');document.querySelector('[data-action="upload"]').onclick=()=>valid()?change('/api/admin/upload-access','POST'):message('Bitte eine gültige Discord User ID eingeben.');document.querySelector('[data-action="all"]').onclick=()=>valid()?change('/api/admin/all-access','POST'):message('Bitte eine gültige Discord User ID eingeben.');document.querySelector('[data-action="remove"]').onclick=()=>valid()?change('/api/admin/all-access','DELETE'):message('Bitte eine gültige Discord User ID eingeben.');document.getElementById('refresh').onclick=load;fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(me=>{if(!me.loggedIn||!me.user?.canManageDatabaseAccess){location.replace('/');return}load()}).catch(()=>location.replace('/'))})();</script></body></html>
